# Gera o APK do Salva Vídeo (vídeo HD sem marca d'água e áudio MP3; pasta baixar-android/, feito com Capacitor) a partir de baixar/.
# No main, com o segredo NEXA_SIGNING_SEED configurado, publica o APK na Release "baixar" (link fixo):
#   https://github.com/andersonrocharsrr-code/Clausclan/releases/download/baixar/baixar.apk
# Sem o segredo, gera só um APK de teste (debug), disponível em "Artifacts" na execução.
name: Gerar APK do Salva Vídeo

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['baixar/**', 'baixar-android/**', 'android-app/scripts/make-keystore.py', '.github/workflows/baixar-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baixar-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BAIXAR_BUILD: ${{ github.run_number }}
    defaults:
      run:
        working-directory: baixar-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: baixar-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para dentro do projeto Android
        run: npm run www && npx cap sync android

      # Mesma chave do Nexa Money (gerada pelo mesmo script e segredo); o Salva Vídeo tem seu próprio applicationId.
      - name: Criar a chave de assinatura
        env:
          NEXA_SIGNING_SEED: ${{ secrets.NEXA_SIGNING_SEED }}
        run: |
          if [ -z "$NEXA_SIGNING_SEED" ]; then
            echo "::warning::Segredo NEXA_SIGNING_SEED não configurado: gerando APK de teste (debug), que não pode ser atualizado depois."
            exit 0
          fi
          pip install --quiet cryptography==49.0.0
          pass=$(python3 ../android-app/scripts/make-keystore.py "$RUNNER_TEMP/baixar.p12")
          echo "::add-mask::$pass"
          echo "BAIXAR_KEYSTORE=$RUNNER_TEMP/baixar.p12" >> "$GITHUB_ENV"
          echo "BAIXAR_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Gerar o APK
        working-directory: baixar-android/android
        run: |
          chmod +x gradlew
          if [ -n "$BAIXAR_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/baixar.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/baixar.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: baixar-apk
          path: ${{ runner.temp }}/baixar.apk

      # Release própria (não marcada como "latest"), para não trocar o link de download do Nexa Money.
      - name: Publicar a versão nova
        if: github.ref == 'refs/heads/main' && env.BAIXAR_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view baixar --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create baixar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Salva Vídeo — vídeos do TikTok em HD e MP3" \
              --notes "Baixe o arquivo baixar.apk no celular e toque nele para instalar. Os vídeos baixados ficam na galeria (Filmes › Salva Vídeo) e os MP3 em Música › Salva Vídeo."
          fi
          gh release upload baixar "$RUNNER_TEMP/baixar.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit baixar --repo "$GITHUB_REPOSITORY" --latest=false --title "Salva Vídeo — vídeos do TikTok em HD e MP3 (versão $BAIXAR_BUILD)"
