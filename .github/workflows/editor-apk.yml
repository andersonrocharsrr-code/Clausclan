# Gera o APK do Editor de Vídeo (cortes, colagem, textos, música, extrair áudio, salvar em até 4K;
# pasta editor-android/, feito com Capacitor) a partir de editor/.
# No main, com o segredo NEXA_SIGNING_SEED configurado, publica o APK na Release "editor" (link fixo):
#   https://github.com/andersonrocharsrr-code/Clausclan/releases/download/editor/editor.apk
# Sem o segredo, gera só um APK de teste (debug), disponível em "Artifacts" na execução.
name: Gerar APK do Editor de Vídeo

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['editor/**', 'editor-android/**', 'android-app/scripts/make-keystore.py', '.github/workflows/editor-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EDITOR_BUILD: ${{ github.run_number }}
    defaults:
      run:
        working-directory: editor-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para dentro do projeto Android
        run: npm run www && npx cap sync android

      # Mesma chave do Nexa Money (gerada pelo mesmo script e segredo); o Editor de Vídeo tem seu próprio applicationId.
      - name: Criar a chave de assinatura
        env:
          NEXA_SIGNING_SEED: ${{ secrets.NEXA_SIGNING_SEED }}
        run: |
          if [ -z "$NEXA_SIGNING_SEED" ]; then
            echo "::warning::Segredo NEXA_SIGNING_SEED não configurado: gerando APK de teste (debug), que não pode ser atualizado depois."
            exit 0
          fi
          pip install --quiet cryptography==49.0.0
          pass=$(python3 ../android-app/scripts/make-keystore.py "$RUNNER_TEMP/editor.p12")
          echo "::add-mask::$pass"
          echo "EDITOR_KEYSTORE=$RUNNER_TEMP/editor.p12" >> "$GITHUB_ENV"
          echo "EDITOR_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Gerar o APK
        working-directory: editor-android/android
        run: |
          chmod +x gradlew
          if [ -n "$EDITOR_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/editor.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/editor.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: editor-apk
          path: ${{ runner.temp }}/editor.apk

      # Release própria (não marcada como "latest"), para não trocar o link de download do Nexa Money.
      - name: Publicar a versão nova
        if: github.ref == 'refs/heads/main' && env.EDITOR_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view editor --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create editor --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Editor de Vídeo — colagem, cortes, música e 4K" \
              --notes "Baixe o arquivo editor.apk no celular e toque nele para instalar. Os vídeos ficam na galeria (Filmes › Editor de Vídeo), os áudios em Música › Editor de Vídeo e as fotos em Imagens › Editor de Vídeo."
          fi
          gh release upload editor "$RUNNER_TEMP/editor.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit editor --repo "$GITHUB_REPOSITORY" --latest=false --title "Editor de Vídeo — colagem, cortes, música e 4K (versão $EDITOR_BUILD)"
