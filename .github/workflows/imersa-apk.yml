# Gera o APK do Calhamaço (app de escrever livros, antigo Imersa, pasta livros-android/, feito com Capacitor) a partir do site em livros/.
# No main, com o segredo NEXA_SIGNING_SEED configurado, publica o APK na Release "imersa" (link fixo):
#   https://github.com/andersonrocharsrr-code/Clausclan/releases/download/imersa/imersa.apk
# Sem o segredo, gera só um APK de teste (debug), disponível em "Artifacts" na execução.
name: Gerar APK do Calhamaço

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['livros/**', 'livros-android/**', 'android-app/scripts/make-keystore.py', '.github/workflows/imersa-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imersa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMERSA_BUILD: ${{ github.run_number }}
    defaults:
      run:
        working-directory: livros-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: livros-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # --no-audit: a checagem de segurança do npm consulta um serviço externo que às vezes não responde e
      # deixa o build parado; ela não muda o que é instalado. O timeout evita esperar à toa se travar de novo.
      - name: Instalar dependências
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Copiar o app para dentro do projeto Android
        run: npm run www && npx cap sync android

      # Mesma chave do Nexa Money (gerada pelo mesmo script e segredo); o Calhamaço tem seu próprio applicationId.
      - name: Criar a chave de assinatura
        env:
          NEXA_SIGNING_SEED: ${{ secrets.NEXA_SIGNING_SEED }}
        run: |
          if [ -z "$NEXA_SIGNING_SEED" ]; then
            echo "::warning::Segredo NEXA_SIGNING_SEED não configurado: gerando APK de teste (debug), que não pode ser atualizado depois."
            exit 0
          fi
          pip install --quiet cryptography==49.0.0
          pass=$(python3 ../android-app/scripts/make-keystore.py "$RUNNER_TEMP/imersa.p12")
          echo "::add-mask::$pass"
          echo "IMERSA_KEYSTORE=$RUNNER_TEMP/imersa.p12" >> "$GITHUB_ENV"
          echo "IMERSA_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Gerar o APK
        working-directory: livros-android/android
        run: |
          chmod +x gradlew
          if [ -n "$IMERSA_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/imersa.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/imersa.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: imersa-apk
          path: ${{ runner.temp }}/imersa.apk

      # Release própria (não marcada como "latest"), para não trocar o link de download do Nexa Money.
      - name: Publicar a versão nova
        if: github.ref == 'refs/heads/main' && env.IMERSA_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view imersa --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create imersa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Calhamaço — escreva o seu livro" \
              --notes "Baixe o arquivo imersa.apk no celular e toque nele para instalar. Os dados continuam no celular ao atualizar."
          fi
          gh release upload imersa "$RUNNER_TEMP/imersa.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit imersa --repo "$GITHUB_REPOSITORY" --latest=false --title "Calhamaço — escreva o seu livro (versão $IMERSA_BUILD)"
