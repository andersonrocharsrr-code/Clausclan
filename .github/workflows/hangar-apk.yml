# Gera o APK do Hangar Escola (aprender sobre aviões, pasta aviao-android/, feito com Capacitor) a partir do site em aviao/.
# No main, com o segredo NEXA_SIGNING_SEED configurado, publica o APK na Release "hangar" (link fixo):
#   https://github.com/andersonrocharsrr-code/Clausclan/releases/download/hangar/hangar-escola.apk
# Sem o segredo, gera só um APK de teste (debug), disponível em "Artifacts" na execução.
name: Gerar APK do Hangar Escola

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['aviao/**', 'aviao-android/**', 'android-app/scripts/make-keystore.py', '.github/workflows/hangar-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hangar-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HANGAR_BUILD: ${{ github.run_number }}
    defaults:
      run:
        working-directory: aviao-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aviao-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para dentro do projeto Android
        run: npm run www && npx cap sync android

      # Mesma chave do Nexa Money (gerada pelo mesmo script e segredo); o Hangar Escola tem seu próprio applicationId.
      - name: Criar a chave de assinatura
        env:
          NEXA_SIGNING_SEED: ${{ secrets.NEXA_SIGNING_SEED }}
        run: |
          if [ -z "$NEXA_SIGNING_SEED" ]; then
            echo "::warning::Segredo NEXA_SIGNING_SEED não configurado: gerando APK de teste (debug), que não pode ser atualizado depois."
            exit 0
          fi
          pip install --quiet cryptography==49.0.0
          pass=$(python3 ../android-app/scripts/make-keystore.py "$RUNNER_TEMP/hangar.p12")
          echo "::add-mask::$pass"
          echo "HANGAR_KEYSTORE=$RUNNER_TEMP/hangar.p12" >> "$GITHUB_ENV"
          echo "HANGAR_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Gerar o APK
        working-directory: aviao-android/android
        run: |
          chmod +x gradlew
          if [ -n "$HANGAR_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/hangar-escola.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/hangar-escola.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hangar-apk
          path: ${{ runner.temp }}/hangar-escola.apk

      # Release própria (não marcada como "latest"), para não trocar o link de download do Nexa Money.
      - name: Publicar a versão nova
        if: github.ref == 'refs/heads/main' && env.HANGAR_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view hangar --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create hangar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Hangar Escola — aprender sobre aviões" \
              --notes "Baixe o arquivo hangar-escola.apk no celular e toque nele para instalar. O progresso das lições continua no celular ao atualizar."
          fi
          gh release upload hangar "$RUNNER_TEMP/hangar-escola.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit hangar --repo "$GITHUB_REPOSITORY" --latest=false --title "Hangar Escola — aprender sobre aviões (versão $HANGAR_BUILD)"
