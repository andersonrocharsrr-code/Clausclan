# Gera o APK do Kinora (app de musculação, pasta treino-android/, feito com Capacitor) a partir do site em treino/.
# No main, com o segredo NEXA_SIGNING_SEED configurado, publica o APK na Release "kinora" (link fixo):
#   https://github.com/andersonrocharsrr-code/Clausclan/releases/download/kinora/kinora.apk
# Sem o segredo, gera só um APK de teste (debug), disponível em "Artifacts" na execução.
name: Gerar APK do Kinora

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['treino/**', 'treino-android/**', 'android-app/scripts/make-keystore.py', '.github/workflows/kinora-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kinora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KINORA_BUILD: ${{ github.run_number }}
    defaults:
      run:
        working-directory: treino-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: treino-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para dentro do projeto Android
        run: npm run www && npx cap sync android

      # Mesma chave do Nexa Money (gerada pelo mesmo script e segredo); o Kinora tem seu próprio applicationId.
      - name: Criar a chave de assinatura
        env:
          NEXA_SIGNING_SEED: ${{ secrets.NEXA_SIGNING_SEED }}
        run: |
          if [ -z "$NEXA_SIGNING_SEED" ]; then
            echo "::warning::Segredo NEXA_SIGNING_SEED não configurado: gerando APK de teste (debug), que não pode ser atualizado depois."
            exit 0
          fi
          pip install --quiet cryptography==49.0.0
          pass=$(python3 ../android-app/scripts/make-keystore.py "$RUNNER_TEMP/kinora.p12")
          echo "::add-mask::$pass"
          echo "KINORA_KEYSTORE=$RUNNER_TEMP/kinora.p12" >> "$GITHUB_ENV"
          echo "KINORA_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Gerar o APK
        working-directory: treino-android/android
        run: |
          chmod +x gradlew
          if [ -n "$KINORA_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kinora.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/kinora.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kinora-apk
          path: ${{ runner.temp }}/kinora.apk

      # Release própria (não marcada como "latest"), para não trocar o link de download do Nexa Money.
      - name: Publicar a versão nova
        if: github.ref == 'refs/heads/main' && env.KINORA_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view kinora --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create kinora --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Kinora — treinador de musculação" \
              --notes "Baixe o arquivo kinora.apk no celular e toque nele para instalar. Os dados continuam no celular ao atualizar."
          fi
          gh release upload kinora "$RUNNER_TEMP/kinora.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit kinora --repo "$GITHUB_REPOSITORY" --latest=false --title "Kinora — treinador de musculação (versão $KINORA_BUILD)"
