# Gera o APK do Caixa (fechamento de caixa, pasta caixa-android/, feito com Capacitor) a partir do site em caixa/.
# No main, com o segredo NEXA_SIGNING_SEED configurado, publica o APK na Release "caixa" (link fixo):
#   https://github.com/andersonrocharsrr-code/Clausclan/releases/download/caixa/caixa.apk
# Sem o segredo, gera só um APK de teste (debug), disponível em "Artifacts" na execução.
name: Gerar APK do Caixa

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths: ['caixa/**', 'caixa-android/**', 'android-app/scripts/make-keystore.py', '.github/workflows/caixa-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caixa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAIXA_BUILD: ${{ github.run_number }}
    defaults:
      run:
        working-directory: caixa-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caixa-android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para dentro do projeto Android
        run: |
          npm run www
          # Número desta versão (o mesmo do APK): o app compara com o versao.json da Release para oferecer atualização.
          echo "window.CAIXA_VERSAO = $CAIXA_BUILD;" > www/versao-app.js
          npx cap sync android

      # Mesma chave do Nexa Money (gerada pelo mesmo script e segredo); o Caixa tem seu próprio applicationId.
      - name: Criar a chave de assinatura
        env:
          NEXA_SIGNING_SEED: ${{ secrets.NEXA_SIGNING_SEED }}
        run: |
          if [ -z "$NEXA_SIGNING_SEED" ]; then
            echo "::warning::Segredo NEXA_SIGNING_SEED não configurado: gerando APK de teste (debug), que não pode ser atualizado depois."
            exit 0
          fi
          pip install --quiet cryptography==49.0.0
          pass=$(python3 ../android-app/scripts/make-keystore.py "$RUNNER_TEMP/caixa.p12")
          echo "::add-mask::$pass"
          echo "CAIXA_KEYSTORE=$RUNNER_TEMP/caixa.p12" >> "$GITHUB_ENV"
          echo "CAIXA_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Gerar o APK
        working-directory: caixa-android/android
        run: |
          chmod +x gradlew
          if [ -n "$CAIXA_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/caixa.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/caixa.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: caixa-apk
          path: ${{ runner.temp }}/caixa.apk

      # Release própria (não marcada como "latest"), para não trocar o link de download do Nexa Money.
      - name: Publicar a versão nova
        if: github.ref == 'refs/heads/main' && env.CAIXA_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view caixa --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create caixa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Caixa — fechamento de caixa" \
              --notes "Baixe o arquivo caixa.apk no celular e toque nele para instalar. Os dados continuam no celular ao atualizar."
          fi
          gh release upload caixa "$RUNNER_TEMP/caixa.apk" --repo "$GITHUB_REPOSITORY" --clobber

          # Pacote das telas (atualização sem APK novo) + versao.json, que os celulares consultam ao abrir o app.
          # apkMin: a partir de qual APK este pacote funciona; muda só quando a parte nativa (plugins, Android) muda.
          # (este passo roda dentro de caixa-android/)
          (cd www && zip -qr "$RUNNER_TEMP/caixa-web.zip" .)
          nativo=$(git ls-files . | grep -v '^www/' | sort | xargs sha256sum | sha256sum | cut -c1-16)
          apkMin=$CAIXA_BUILD
          if gh release download caixa --repo "$GITHUB_REPOSITORY" -p versao.json -D "$RUNNER_TEMP/ant" 2>/dev/null; then
            if [ "$(jq -r '.nativo // empty' "$RUNNER_TEMP/ant/versao.json")" = "$nativo" ]; then
              apkMin=$(jq -r '.apkMin' "$RUNNER_TEMP/ant/versao.json")
            fi
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/caixa"
          jq -n --argjson versao "$CAIXA_BUILD" --argjson apkMin "$apkMin" --arg nativo "$nativo" \
            --arg zip "$base/caixa-web.zip" --arg apk "$base/caixa.apk" \
            --arg checksum "$(sha256sum "$RUNNER_TEMP/caixa-web.zip" | cut -d' ' -f1)" \
            '{versao:$versao, apkMin:$apkMin, nativo:$nativo, zip:$zip, apk:$apk, checksum:$checksum}' > "$RUNNER_TEMP/versao.json"
          cat "$RUNNER_TEMP/versao.json"
          gh release upload caixa "$RUNNER_TEMP/caixa-web.zip" --repo "$GITHUB_REPOSITORY" --clobber
          # Por último: só avisa os celulares quando o pacote e o APK já estão no ar.
          gh release upload caixa "$RUNNER_TEMP/versao.json" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit caixa --repo "$GITHUB_REPOSITORY" --latest=false --title "Caixa — fechamento de caixa (versão $CAIXA_BUILD)"
