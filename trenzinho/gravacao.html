<!doctype html>
<!-- Não é uma página para assistir: é só o quadro que o gravar.js usa para gerar o vídeo MP4. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O Trenzinho das Cores (quadro de gravação)</title>
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(fredoka-700.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; background: #000; }
  #palco { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<svg id="palco" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="js/letra.js"></script>
<script src="js/base.js"></script>
<script src="js/arte.js"></script>
<script src="js/trem.js"></script>
<script src="js/bichos.js"></script>
<script src="js/mundos.js"></script>
<script src="js/frontal.js"></script>
<script src="js/clipe.js"></script>
<script>
  // O gravar.js chama T.seek(t) quadro a quadro depois que a fonte do título carrega.
  T.seek(0);
  document.fonts.load('700 100px Fredoka').then(() => document.fonts.ready).then(() => { T.seek(0); window.PRONTO = true; });
</script>
</body>
</html>
