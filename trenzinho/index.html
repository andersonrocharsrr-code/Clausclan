<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Trenzinho das Cores</title>
<meta name="theme-color" content="#2B2046">
<style>
  @font-face { font-family: Fredoka; font-weight: 700; src: url(fredoka-700.woff2) format('woff2'); font-display: block; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2B2046; color: #FFF4DD; font-family: Fredoka, 'Arial Rounded MT Bold', system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 8px; }
  #quadro { position: relative; width: min(100%, calc((100vh - 86px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #7CCBF5; box-shadow: 0 10px 40px #0007; }
  #palco { display: block; width: 100%; height: 100%; }
  #capa { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #2B204655; border: 0; cursor: pointer; }
  #capa span { background: #F0665A; color: #fff; font: inherit; font-size: clamp(18px, 4vw, 40px); padding: .5em 1.2em; border-radius: 999px; box-shadow: 0 6px 0 #D24C45; }
  #barra { display: flex; align-items: center; gap: 8px; width: min(100%, calc((100vh - 86px) * 16 / 9)); }
  #barra button { font: inherit; font-size: 16px; color: #2B2046; background: #F7C245; border: 0; border-radius: 999px; padding: 10px 16px; min-width: 48px; min-height: 44px; cursor: pointer; box-shadow: 0 4px 0 #E0A52B; }
  #barra button:active { transform: translateY(2px); box-shadow: 0 2px 0 #E0A52B; }
  #pos { flex: 1; min-width: 60px; accent-color: #F0665A; height: 32px; }
  #tempo { font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
  body.render { padding: 0; background: #000; display: block; }
  body.render #quadro { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
  body.render #barra, body.render #capa { display: none; }
  #quadro:fullscreen { width: 100vw; height: 100vh; border-radius: 0; background: #000; }
</style>
</head>
<body>
<div id="quadro">
  <svg id="palco" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
  <button id="capa" aria-label="Tocar o clipe"><span>▶ Tocar</span></button>
</div>
<div id="barra">
  <button id="tocar" aria-label="Tocar ou pausar">▶</button>
  <button id="inicio" aria-label="Voltar ao começo">⟲</button>
  <input id="pos" type="range" min="0" max="137.28" step="0.01" value="0" aria-label="Posição na música">
  <span id="tempo">0:00 / 2:17</span>
  <button id="cheia" aria-label="Tela cheia">⛶</button>
</div>
<audio id="musica" src="musica.m4a" preload="auto"></audio>
<script src="js/letra.js"></script>
<script src="js/base.js"></script>
<script src="js/arte.js"></script>
<script src="js/trem.js"></script>
<script src="js/bichos.js"></script>
<script src="js/mundos.js"></script>
<script src="js/frontal.js"></script>
<script src="js/clipe.js"></script>
<script src="js/tocador.js"></script>
</body>
</html>
