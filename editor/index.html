<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Editor de Vídeo</title>
  <meta name="description" content="Edita vídeos no celular: cortes, colagem, textos, filtros, música, extrair áudio e salvar em até 4K.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=22">
  <script type="importmap">{ "imports": { "mediabunny": "./vendor/mediabunny.min.mjs" } }</script>
</head>
<body>
  <div class="app">
    <header class="topo">
      <button id="menu" class="ic-btn ic-btn--caixa" type="button" aria-label="Meus projetos" title="Meus projetos"></button>
      <button id="titulo" class="titulo" type="button" aria-label="Mudar o nome do projeto">
        <b id="tituloNome">Novo projeto</b><small id="tituloInfo">0:00</small>
      </button>
      <button id="qualidade" class="qual" type="button" aria-label="Resolução do vídeo">4K <span>▾</span></button>
      <button id="salvarVideo" class="salvar-btn" type="button" disabled>Salvar</button>
    </header>

    <div id="semWebCodecs" class="aviso-caixa" hidden>
      Este navegador não consegue gravar vídeo. Use o app no Android (Chrome atualizado).
    </div>

    <div id="palco" class="palco">
      <canvas id="tela" width="540" height="960"></canvas>
      <div id="vazio" class="vazio">
        <button id="comecar" class="comecar" type="button"><span>＋</span>Escolher vídeos e fotos</button>
        <button id="comecarColagem" class="comecar comecar--2" type="button"><span>▦</span>Fazer uma colagem</button>
      </div>
    </div>

    <div class="controles">
      <button id="telaCheia" class="ic-btn ic-btn--p" type="button" aria-label="Tela cheia"></button>
      <span id="tempo" class="tempo">00:00 / 00:00</span>
      <button id="play" class="play" type="button" aria-label="Tocar"></button>
      <span class="controles__esp"></span>
      <button id="desfazer" class="ic-btn ic-btn--p" type="button" aria-label="Desfazer" disabled></button>
      <button id="refazer" class="ic-btn ic-btn--p" type="button" aria-label="Refazer" disabled></button>
    </div>

    <div id="linha" class="linha">
      <div id="rolo" class="rolo">
        <div id="conteudo" class="conteudo">
          <div id="regua" class="regua"></div>
          <div id="trilha" class="trilha"></div>
          <div id="trilhaTexto" class="trilha-texto"></div>
          <div id="trilhaMusica" class="trilha-musica"></div>
        </div>
      </div>
      <!-- Ícone de cada faixa, fixo na esquerda -->
      <div class="cabecas" aria-hidden="true">
        <span id="cabVideo" class="cab cab--video"></span>
        <span id="cabTexto" class="cab cab--texto"></span>
        <span id="cabMusica" class="cab cab--musica"></span>
      </div>
      <span class="agulha" aria-hidden="true"></span>
      <button id="maisFim" class="mais-fim" type="button" aria-label="Adicionar vídeo ou foto">＋</button>
    </div>

    <div id="baixo" class="baixo">
      <nav id="barra" class="barra"></nav>
      <nav id="abas" class="abas"></nav>
    </div>

    <section id="painel" class="painel" hidden>
      <div class="painel__topo">
        <h2 id="painelTitulo"></h2>
        <button id="painelOk" class="ok-btn" type="button" aria-label="Pronto">✓</button>
      </div>
      <div id="painelCorpo" class="painel__corpo"></div>
    </section>
  </div>

  <!-- Tela inicial: novo projeto, meus projetos e ferramentas rápidas -->
  <section id="pgInicio" class="inicio" hidden>
    <div class="inicio__corpo">
      <h1>Editor de Vídeo</h1>
      <p class="inicio__sub">Seus vídeos ficam guardados aqui.</p>
      <button id="novoProjeto" class="novo" type="button">
        <span class="novo__mais">＋</span>
        <span><b>Novo projeto</b><small>Vídeos, fotos ou colagem</small></span>
      </button>
      <div class="secao"><b>Meus projetos</b><small id="qtProjetos"></small></div>
      <div id="cartoes" class="cartoes"></div>
      <div class="secao"><b>Ferramentas rápidas</b></div>
      <div class="rapidas">
        <button id="rapAudio" class="rapida" type="button"><span class="rapida__ic"></span>Extrair áudio</button>
        <button id="rapLegenda" class="rapida" type="button"><span class="rapida__ic"></span>Legendas</button>
        <button id="rapConverter" class="rapida" type="button"><span class="rapida__ic"></span>Converter 4K</button>
      </div>
    </div>
  </section>

  <section id="pgFerramentas" class="pagina" hidden>
    <header class="topo">
      <button id="ferrFechar" class="ic-btn" type="button" aria-label="Voltar"></button>
      <h1 class="pagina__titulo">Áudio e conversão</h1>
    </header>
    <div class="pagina__corpo">
      <section class="cartao">
        <h3>Escolher vídeo</h3>
        <button id="ferrEscolher" class="btn btn--pri" type="button">📂 Escolher da galeria</button>
      </section>
      <div id="ferrConteudo"></div>
    </div>
  </section>

  <div id="folha" class="folha" hidden>
    <div class="folha__caixa" role="dialog" aria-modal="true" aria-labelledby="folhaTitulo">
      <div class="folha__topo">
        <h2 id="folhaTitulo"></h2>
        <button id="folhaFechar" class="ic-btn" type="button" aria-label="Fechar">✕</button>
      </div>
      <div id="folhaCorpo"></div>
    </div>
  </div>

  <div id="progresso" class="progresso" hidden>
    <div class="progresso__caixa">
      <p id="progTexto">…</p>
      <div class="barra-prog"><span id="progBarra"></span></div>
      <button id="cancelar" class="btn btn--sec" type="button" hidden>Cancelar</button>
    </div>
  </div>

  <p id="aviso" class="toast" role="status" hidden></p>

  <script type="module" src="app.js?v=19"></script>
</body>
</html>
