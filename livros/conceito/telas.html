<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imersa — conceito de telas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a12; --panel:#15121d; --panel2:#1c1827; --panel3:#241f31;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#efe9f7; --muted:#9d95b0; --dim:#6d6680;
  --amber:#f2b563; --amber2:#e8944a; --teal:#5fd3c1; --rose:#ec8fae; --violet:#a58bff; --sky:#7cb7ff;
  --paper:#f7efe0; --paper2:#efe3cd; --ink:#2b2231; --ink2:#6b5d64;
  --serif:'Cormorant Garamond',Georgia,serif; --display:'Fraunces',Georgia,serif; --ui:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05040a;font-family:var(--ui);color:var(--text);-webkit-font-smoothing:antialiased}
.screen{width:1600px;height:1000px;position:relative;overflow:hidden;margin:0 0 40px}
.backdrop{background:
  radial-gradient(900px 600px at 15% 0%,rgba(165,139,255,.22),transparent 60%),
  radial-gradient(800px 600px at 100% 100%,rgba(242,181,99,.16),transparent 60%),
  linear-gradient(160deg,#1a1426,#0a0810 60%)}
.win{position:absolute;inset:24px;border-radius:18px;overflow:hidden;background:var(--bg);
  box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08) inset;display:flex;flex-direction:column}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center}
.muted{color:var(--muted)}

/* ---------- barra superior ---------- */
.top{height:60px;flex:none;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(#17131f,#131019)}
.dots{display:flex;gap:8px;margin-right:6px}.dots i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.2px}
.logo .mk{width:30px;height:30px}
.crumb{white-space:nowrap;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center}.crumb b{color:var(--text);font-weight:500}
.tools{display:flex;gap:4px;padding:5px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.tools span{height:32px;min-width:34px;padding:0 9px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:7px;color:#cfc7de;font-size:13px}
.tools span.on{background:var(--panel3);color:#fff}
.tools .sep{min-width:1px;width:1px;padding:0;background:var(--line2);margin:6px 3px;height:20px}
.tools .snd{color:var(--teal)}.tools .img{color:var(--amber)}
.btn{white-space:nowrap;height:36px;padding:0 15px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;border:1px solid var(--line2);color:var(--text);background:var(--panel2)}
.btn.pri{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#2a1606;border:0;box-shadow:0 8px 24px rgba(242,181,99,.25)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#a58bff,#ec8fae);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#1a1024}
.saved{white-space:nowrap;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}.saved i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.grow{flex:1}

/* ---------- barra lateral ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.bookcard{display:flex;gap:12px;padding:6px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.bookcard .cv{width:62px;height:88px;border-radius:5px;overflow:hidden;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.5);position:relative}
.bookcard h3{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.2;margin-bottom:6px}
.prog{height:5px;border-radius:9px;background:var(--panel3);overflow:hidden;margin:8px 0 5px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--rose));border-radius:9px}
.lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:600;padding:8px 8px 4px}
.ch{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:#cfc7de}
.ch .n{font-family:var(--display);color:var(--dim);width:18px;font-size:13px}
.ch .meta{margin-left:auto;display:flex;gap:7px;font-size:11.5px;color:var(--dim)}
.ch .meta span{display:flex;gap:3px;align-items:center}.ch .meta svg{width:12px;height:12px}
.ch.on{background:linear-gradient(90deg,rgba(242,181,99,.16),rgba(242,181,99,.04));color:#fff;box-shadow:inset 2px 0 0 var(--amber)}
.ch.on .n{color:var(--amber)}
.navi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:#cfc7de}
.navi .c{margin-left:auto;font-size:11.5px;color:var(--dim)}

/* ---------- papel / manuscrito ---------- */
.desk{position:relative;overflow:hidden;background:
  radial-gradient(700px 400px at 50% 0%,rgba(242,181,99,.06),transparent 70%),#100d16}
.deskbar{display:flex;justify-content:space-between;align-items:center;width:720px;margin:20px auto 14px;font-size:12.5px;color:var(--muted)}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.seg span{padding:6px 13px;border-radius:7px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg span.on{background:var(--panel3);color:#fff}
.paper{width:720px;margin:0 auto;background:linear-gradient(180deg,var(--paper),#f3e9d6);color:var(--ink);border-radius:6px 6px 0 0;
  padding:34px 66px 40px;box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.2);position:relative;min-height:900px}
.paper p{font-family:var(--serif);font-size:20.5px;line-height:1.55;margin:0 0 14px;text-align:justify;hyphens:auto;color:#2e2532}
.chapno{font-family:var(--ui);font-size:11px;letter-spacing:3.5px;color:#a28b74;text-align:center;font-weight:600;margin-top:14px}
.chaptitle{font-family:var(--serif);font-style:italic;font-weight:500;font-size:44px;text-align:center;line-height:1.1;margin:6px 0 18px;color:#2a1f2c}
.orn{text-align:center;color:#c09a6b;font-size:18px;margin-bottom:16px;letter-spacing:8px}
.drop::first-letter{font-family:var(--display);float:left;font-size:66px;line-height:.86;padding:6px 10px 0 0;color:#9b5a3c;font-weight:600}
.cue{display:inline-flex;align-items:center;gap:5px;font-family:var(--ui);font-size:12px;font-weight:600;color:#17796c;background:rgba(95,211,193,.18);border:1px solid rgba(23,121,108,.25);padding:2px 8px 2px 6px;border-radius:20px;vertical-align:3px;margin:0 2px}
.cue svg{width:13px;height:13px}
.cue.fx{color:#8a4f12;background:rgba(242,181,99,.22);border-color:rgba(138,79,18,.22)}
.amb{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:linear-gradient(90deg,rgba(95,211,193,.16),rgba(95,211,193,.05));border:1px dashed rgba(23,121,108,.35)}
.amb .ic{width:38px;height:38px;border-radius:10px;background:#17796c;color:#eafff9;display:flex;align-items:center;justify-content:center}
.amb small{display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#4c8b80;font-weight:600}
.amb b{font-size:14px;color:#1f3b37;font-weight:600}
.amb .wf{flex:1;height:30px}
.amb .tag{font-size:11.5px;color:#4c8b80;display:flex;gap:5px;align-items:center}
.fig{position:relative;margin:18px -20px 6px;border-radius:6px;outline:2px solid var(--amber2);outline-offset:4px}
.fig .art{height:200px;border-radius:6px;overflow:hidden;box-shadow:0 14px 30px rgba(43,34,49,.35)}
.fig .h{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--amber2);border-radius:3px}
.figbar{position:absolute;top:12px;right:12px;display:flex;gap:3px;padding:4px;background:rgba(18,14,24,.86);backdrop-filter:blur(6px);border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.figbar span{display:flex;gap:6px;align-items:center;font-size:12px;color:#e8e2f2;padding:6px 9px;border-radius:7px;font-family:var(--ui)}
.figbar span.on{background:rgba(242,181,99,.2);color:var(--amber)}
.figbar svg{width:14px;height:14px}
.cap{font-family:var(--serif);font-style:italic;text-align:center;font-size:15.5px;color:#8a7a74;margin:12px 0 16px}
.caret{display:inline-block;width:2px;height:22px;background:#9b5a3c;vertical-align:-4px;margin-left:1px;box-shadow:0 0 6px rgba(155,90,60,.5)}
.slash{position:absolute;width:300px;background:#1a1623;border-radius:14px;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 60px rgba(0,0,0,.5);padding:8px;color:var(--text);font-family:var(--ui)}
.slash .hd{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);padding:6px 8px 8px;font-weight:600}
.slash .it{display:flex;gap:11px;align-items:center;padding:8px;border-radius:9px}
.slash .it.on{background:var(--panel3)}
.slash .it .b{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.slash .it b{font-size:13.5px;font-weight:600;display:block}.slash .it small{font-size:11.5px;color:var(--muted)}
.slash kbd{margin-left:auto;font-family:var(--ui);font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}

/* ---------- painel de som ---------- */
.rp{background:var(--panel);border-left:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.rp h4{font-family:var(--display);font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.rp h4 .x{margin-left:auto;font-family:var(--ui);font-size:12px;color:var(--muted);font-weight:500}
.layer{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.layer .t{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.layer .t .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.layer .t small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.layer .t .m{margin-left:auto;color:var(--muted)}
.layer .wf{height:26px;margin:9px 0 6px}
.vol{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted)}
.vol .bar{flex:1;height:4px;border-radius:9px;background:var(--panel3);position:relative}
.vol .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.vol .bar b{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mom{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.mom .p{font-family:var(--display);font-size:12px;color:var(--dim);width:26px}
.mom .d{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.mom small{margin-left:auto;font-size:11.5px;color:var(--dim)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs > div{height:62px;border-radius:8px;overflow:hidden;position:relative}
.thumbs .add{border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.player{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:linear-gradient(135deg,rgba(95,211,193,.16),rgba(165,139,255,.14));border:1px solid rgba(95,211,193,.25)}
.player .pb{width:42px;height:42px;border-radius:50%;background:var(--teal);color:#06231f;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(95,211,193,.15)}
.player .pb svg{fill:currentColor;stroke:none;width:16px;height:16px;margin-left:2px}
.player b{font-size:13.5px;display:block}.player small{font-size:11.5px;color:var(--muted)}

/* ---------- leitura imersiva ---------- */
.reader{position:absolute;inset:0}
.reader .bgart{position:absolute;inset:0}
.reader .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,8,12,0) 30%,rgba(5,8,12,.55) 52%,rgba(5,8,12,.92) 70%),linear-gradient(0deg,rgba(5,8,12,.85),transparent 25%),linear-gradient(180deg,rgba(5,8,12,.6),transparent 16%)}
.rtop{position:absolute;top:0;left:0;right:0;height:78px;display:flex;align-items:center;padding:0 34px;gap:16px}
.ghost{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#e9eef2}
.ghost.on{background:rgba(95,211,193,.2);color:var(--teal);border-color:rgba(95,211,193,.4)}
.rtitle{font-size:13px;color:rgba(233,238,242,.7);letter-spacing:.3px}.rtitle b{display:block;color:#fff;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:0;margin-bottom:2px}
.rtext{position:absolute;top:118px;right:110px;width:560px}
.rtext .chapno{color:rgba(242,181,99,.85);text-align:left}
.rtext h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:54px;line-height:1.05;margin:10px 0 22px;color:#fff}
.rtext p{font-family:var(--serif);font-size:23px;line-height:1.6;color:rgba(234,238,240,.42);margin-bottom:18px}
.rtext p.now{color:#f4f1ea}
.rtext p .hl{color:#fff;background:linear-gradient(transparent 62%,rgba(242,181,99,.35) 62%);}
.rtext p .read{color:rgba(244,241,234,.95)}
.burst{position:absolute;display:flex;align-items:center;gap:10px;padding:9px 15px 9px 10px;border-radius:30px;background:rgba(15,20,26,.7);backdrop-filter:blur(12px);border:1px solid rgba(242,181,99,.45);color:#fff;font-size:13px;font-weight:600;box-shadow:0 0 0 8px rgba(242,181,99,.07),0 0 40px rgba(242,181,99,.25)}
.burst .d{width:28px;height:28px;border-radius:50%;background:var(--amber);color:#2a1606;display:flex;align-items:center;justify-content:center}
.burst small{display:block;font-weight:500;color:rgba(255,255,255,.6);font-size:11px}
.rbottom{position:absolute;left:34px;right:34px;bottom:28px;display:flex;align-items:flex-end;gap:22px}
.now-pl{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:18px;background:rgba(12,16,22,.6);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);width:420px}
.eq{display:flex;align-items:flex-end;gap:3px;height:22px}.eq i{width:4px;border-radius:2px;background:var(--teal)}
.now-pl b{font-size:14px;display:block}.now-pl small{font-size:12px;color:rgba(233,238,242,.6)}
.chips{display:flex;gap:6px;margin-top:7px}.chips span{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.08);color:#dfe7ea;display:flex;gap:5px;align-items:center}
.chips svg{width:12px;height:12px}
.track{flex:1;padding-bottom:6px}
.track .ln{position:relative;height:4px;border-radius:9px;background:rgba(255,255,255,.14)}
.track .ln i{position:absolute;left:0;top:0;bottom:0;width:41%;border-radius:9px;background:linear-gradient(90deg,var(--amber),#fff)}
.track .mk{position:absolute;top:-12px;width:8px;height:8px;border-radius:50%;transform:translateX(-50%)}
.track .knob{position:absolute;top:50%;left:41%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 5px rgba(255,255,255,.15)}
.track .lg{display:flex;justify-content:space-between;font-size:12px;color:rgba(233,238,242,.6);margin-top:12px}
.track .lg span{display:flex;gap:6px;align-items:center}.track .lg i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- estúdio de trilha ---------- */
.studio{display:grid;grid-template-columns:1fr 360px;flex:1;min-height:0}
.tl{display:flex;flex-direction:column;min-width:0;background:#100d16}
.tlhead{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line)}
.tlhead h2{font-family:var(--display);font-weight:600;font-size:20px}
.tlhead h2 small{display:block;font-family:var(--ui);font-weight:500;font-size:12.5px;color:var(--muted);margin-top:3px}
.transport{display:flex;align-items:center;gap:8px;margin-left:auto}
.transport .pb{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#06231f;display:flex;align-items:center;justify-content:center}
.transport .pb svg{fill:currentColor;stroke:none;width:15px;height:15px;margin-left:2px}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);padding:0 10px}.time b{color:#fff;font-weight:600}
.grid{position:relative;flex:1;display:grid;grid-template-columns:200px 1fr;min-height:0}
.ruler{height:116px;border-bottom:1px solid var(--line);position:relative;background:var(--panel)}
.para{position:absolute;top:12px;bottom:10px;padding:0 10px;border-left:1px solid var(--line)}
.para b{font-family:var(--display);font-size:12px;color:var(--amber);font-weight:600}
.para p{font-family:var(--serif);font-size:14.5px;line-height:1.3;color:#cfc7de;margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.para.cur{background:rgba(242,181,99,.06)}
.para p mark{background:rgba(242,181,99,.28);color:#fff;border-radius:3px;padding:0 2px}
.th{border-right:1px solid var(--line);background:var(--panel)}
.th .rh{height:116px;border-bottom:1px solid var(--line);padding:16px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;align-items:flex-end}
.th .tr{height:104px;border-bottom:1px solid var(--line);padding:14px 14px;display:flex;flex-direction:column;gap:9px}
.th .tr b{font-size:13.5px;display:flex;gap:8px;align-items:center}
.th .tr .ms{display:flex;gap:5px}.th .tr .ms span{font-size:10.5px;font-weight:700;width:22px;height:20px;border-radius:5px;background:var(--panel3);color:var(--muted);display:flex;align-items:center;justify-content:center}
.th .tr .ms span.s{background:rgba(242,181,99,.2);color:var(--amber)}
.lane{position:relative;height:104px;border-bottom:1px solid var(--line)}
.clip{position:absolute;top:14px;height:76px;border-radius:10px;overflow:hidden;padding:7px 10px;font-size:12px;font-weight:600}
.clip small{display:block;font-weight:500;font-size:10.5px;opacity:.75;margin-top:1px}
.clip svg.w{position:absolute;left:0;right:0;bottom:4px;width:100%;height:36px}
.clip.sel{box-shadow:0 0 0 2px #fff,0 10px 30px rgba(0,0,0,.5)}
.clip .fade{position:absolute;top:0;bottom:0;width:60px}
.imgclip{position:absolute;top:12px;height:80px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.imgclip span{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);box-shadow:0 0 12px var(--amber);z-index:5}
.playhead:before{content:"";position:absolute;top:-1px;left:-7px;border:8px solid transparent;border-top:10px solid var(--amber)}
.inspector{border-top:1px solid var(--line);background:var(--panel);padding:16px 22px;display:flex;gap:26px;align-items:center}
.inspector .f{display:flex;flex-direction:column;gap:6px}
.inspector .f label{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:600}
.inspector .f > div{font-size:13.5px;padding:8px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:flex;gap:8px;align-items:center}
.lib{background:var(--panel);border-left:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.search{display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;padding:5px 11px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:#cfc7de}
.tags span.on{background:rgba(95,211,193,.16);color:var(--teal);border-color:rgba(95,211,193,.35)}
.sitem{display:flex;align-items:center;gap:11px;padding:9px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.sitem .pp{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.sitem .pp svg{fill:currentColor;stroke:none;width:12px;height:12px;margin-left:2px}
.sitem b{font-size:13px;display:block;white-space:nowrap}.sitem small{font-size:11px;color:var(--muted)}
.sitem .wf{width:84px;height:24px;margin-left:auto;flex:none}
.sitem.playing{border-color:rgba(95,211,193,.4);background:linear-gradient(90deg,rgba(95,211,193,.12),var(--panel2))}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.rec div{display:flex;gap:9px;align-items:center;justify-content:center;height:44px;border-radius:12px;font-size:13px;font-weight:600}

/* ---------- celular ---------- */
.phones{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:70px;padding-top:30px}
.phone{width:360px;height:760px;border-radius:52px;background:#0b0a10;padding:11px;box-shadow:0 0 0 2px #2c2838,0 0 0 9px #14121b,0 50px 90px rgba(0,0,0,.6);position:relative}
.phone .scr{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;background:var(--bg)}
.phone .isl{position:absolute;top:21px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:20}
.sb{height:52px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-size:14px;font-weight:600;position:relative;z-index:10}
.ptag{position:absolute;bottom:-62px;left:0;right:0;text-align:center;font-family:var(--display);font-weight:600;font-size:19px}
.ptag small{display:block;font-family:var(--ui);font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;padding:12px 26px 0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(12,10,18,.95) 30%);border-top:1px solid var(--line)}
.tabbar span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--dim)}
.tabbar span.on{color:var(--amber)}
.tabbar .fab{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,var(--amber),var(--amber2));color:#2a1606;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 10px 24px rgba(242,181,99,.35)}
.cover{position:relative;border-radius:6px 10px 10px 6px;overflow:hidden;box-shadow:0 14px 26px rgba(0,0,0,.55)}
.cover:after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12),transparent)}
.cover .ct{position:absolute;left:10px;right:8px;bottom:10px;font-family:var(--serif);font-weight:600;color:#fff;line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.cover .ct small{display:block;font-family:var(--ui);font-weight:500;font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.8;margin-top:4px}
.cover .badges{position:absolute;top:7px;right:7px;display:flex;gap:4px}
.cover .badges span{width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:#fff}
.cover .badges svg{width:11px;height:11px}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;background:#1a1623;border-top:1px solid var(--line2);padding:10px 18px 30px;box-shadow:0 -30px 60px rgba(0,0,0,.6)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 14px}
.stabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--panel2);margin-bottom:14px}
.stabs span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;padding:8px 0;border-radius:9px;color:var(--muted)}
.stabs span.on{background:var(--panel3);color:var(--teal)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sgrid div{border-radius:14px;padding:10px 8px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-align:center}
.sgrid div .e{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.sgrid div.on{border-color:rgba(95,211,193,.5);background:rgba(95,211,193,.1)}
</style>
</head>

const I=(n,s='')=>`<svg class="i" viewBox="0 0 24 24" ${s?`style="${s}"`:''}>${IC[n]}</svg>`;

// forma de onda (barras espelhadas)
function wave(seed,n,color,opt={}){const r=rng(seed);let b='';const W=n*4;
 for(let k=0;k<n;k++){const env=opt.env?opt.env(k/n):1;const h=Math.max(.06,(.25+.75*Math.abs(Math.sin(k*.33+seed)) *r())*env);
  b+=`<rect x="${k*4}" y="${(1-h)*20}" width="2.2" height="${h*40}" rx="1.1" fill="${typeof color==='function'?color(k/n):color}"/>`;}
 return `<svg class="${opt.cls||'wf'}" viewBox="0 0 ${W} 40" preserveAspectRatio="none">${b}</svg>`;}

/* ---------- ilustrações (SVG gerado) ---------- */
function pine(x,y,h,c){const w=h*.42;let d='';for(let k=0;k<4;k++){const t=y-h+k*h*.2, bt=t+h*.36, ww=w*(.32+k*.24);d+=`M${x},${t} L${x+ww/2},${bt} L${x-ww/2},${bt}Z`;}
 return `<path d="${d}M${x-h*.025},${y-h*.25}h${h*.05}V${y}h-${h*.05}Z" fill="${c}"/>`;}
function ridge(r,y,amp,step,c,W=1200,H=700){let d=`M0,${H} L0,${y}`;let v=y;for(let x=0;x<=W;x+=step){v=y-amp*(.4+.6*r())*Math.abs(Math.sin(x*.004+r()));d+=` L${x},${v.toFixed(1)}`;}return `<path d="${d} L${W},${H}Z" fill="${c}"/>`;}

 </defs>

 <polygon points="760,150 0,40 0,330" fill="url(#${id}b)" opacity=".8"/>
 <polygon points="760,150 -40,180 -40,300" fill="url(#${id}b)" opacity=".35"/>
