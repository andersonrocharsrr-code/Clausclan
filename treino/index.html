<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fibrafit — Treinador de musculação</title>
  <meta name="description" content="Fibrafit: seu treinador visual de musculação. Mostra o que fazer, como fazer, quanto fazer e quando descansar.">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <!-- Abertura: a logo se desenha e o nome aparece (toque para pular) -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash__stage">
      <div class="splash__glow"></div>
      <svg class="splash__logo" viewBox="0 0 512 512">
        <rect class="splash__box" x="0" y="0" width="512" height="512" rx="116"/>
        <g class="splash__f" fill="none" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
          <path class="s1" pathLength="1" d="M190 370V142"/>
          <path class="s2" pathLength="1" d="M190 142h132"/>
          <path class="s3" pathLength="1" d="M190 256h104"/>
        </g>
      </svg>
      <div class="splash__ring"></div>
    </div>
    <div class="splash__name"><span>F</span><span>i</span><span>b</span><span>r</span><span>a</span><b>f</b><b>i</b><b>t</b></div>
    <p class="splash__tag">Seu treinador visual de musculação</p>
    <div class="splash__bar"><i></i></div>
  </div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="brand__logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="116" fill="var(--logo-bg)"/><g fill="none" stroke="var(--accent)" stroke-width="70" stroke-linecap="round"><path d="M190 142v228M190 142h132M190 256h104"/></g></svg>
        <div>
          <h1 class="brand__name" id="topTitle">Fibrafit</h1>
          <p class="brand__sub" id="topSub"></p>
        </div>
      </div>
      <button class="avatar" id="btnProfile" type="button" aria-label="Perfil">F</button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <button class="resume" id="resumeBar" type="button" hidden>
      <span class="resume__dot" aria-hidden="true"></span>
      <span class="resume__txt"><strong id="resumeName">Treino</strong><small>Toque para voltar ao treino</small></span>
      <span class="resume__time" id="resumeTime">0:00</span>
    </button>

    <nav class="tabs" aria-label="Seções">
      <button type="button" class="tab" data-tab="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        <span>Início</span>
      </button>
      <button type="button" class="tab" data-tab="treinos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
        <span>Treinos</span>
      </button>
      <button type="button" class="tab" data-tab="exercicios">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="m8 21 2.5-6.5L8 11l4-2 4 2-2.5 3.5L16 21"/><path d="M5 9.5 8 11M19 9.5 16 11"/></svg>
        <span>Exercícios</span>
      </button>
      <button type="button" class="tab" data-tab="evolucao">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="m5 15 4.5-5 3.5 3 6-7"/><path d="M15 6h4v4"/></svg>
        <span>Evolução</span>
      </button>
      <button type="button" class="tab" data-tab="perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <!-- Primeiro acesso: objetivo, dias, nível → plano -->
  <section class="onb" id="onb" hidden aria-label="Montar meu plano">
    <div class="onb__top">
      <button type="button" class="icon-btn" id="onbBack" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="onb__bar"><i id="onbFill"></i></div>
      <button type="button" class="link" id="onbSkip">Pular</button>
    </div>
    <div class="onb__body" id="onbBody"></div>
    <div class="onb__foot"><button type="button" class="btn btn--primary btn--block btn--lg" id="onbNext">Continuar</button></div>
  </section>

  <!-- Treino em andamento: um exercício por vez -->
  <section class="live" id="live" hidden aria-label="Treino em andamento">
    <header class="live__top">
      <button class="icon-btn" id="liveMin" type="button" aria-label="Minimizar treino">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="live__title">
        <input id="liveName" class="live__name" type="text" maxlength="40" aria-label="Nome do treino">
        <span class="live__meta"><span id="liveClock">0:00</span> · <span id="liveSets">0 séries</span> · <span id="liveVol">0 kg</span></span>
      </div>
      <button class="btn btn--primary btn--sm" id="liveFinish" type="button">Finalizar</button>
    </header>
    <div class="live__prog" id="liveProg"></div>
    <div class="live__body" id="liveBody"></div>
    <footer class="live__nav">
      <button type="button" class="nav-btn" id="livePrev" aria-label="Exercício anterior"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <button type="button" class="nav-list" id="liveList"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span id="livePos">1 de 6</span></button>
      <button type="button" class="nav-btn" id="liveNext" aria-label="Próximo exercício"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </footer>

    <!-- Descanso entre as séries -->
    <div class="rest" id="rest" hidden>
      <div class="rest__inner">
        <p class="rest__label" id="restLabel">⏱️ DESCANSO</p>
        <div class="ring">
          <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="88" class="ring__bg"/><circle cx="100" cy="100" r="88" class="ring__fg" id="restRing"/></svg>
          <div class="ring__c">
            <div class="breath" aria-hidden="true"><i></i></div>
            <strong id="restTime">1:30</strong>
            <small id="restBreath">Inspire…</small>
          </div>
        </div>
        <p class="rest__msg" id="restMsg">Recupere-se para a próxima série.</p>
        <div class="rest__adj">
          <button type="button" class="rest__btn" data-rest="-15">− 15s</button>
          <button type="button" class="rest__btn" data-rest="15">+ 15s</button>
        </div>
        <div class="rest__next" id="restNext"></div>
        <button type="button" class="btn btn--primary btn--block btn--lg" data-rest="skip" id="restGo">PRÓXIMA SÉRIE →</button>
      </div>
    </div>
  </section>

  <!-- Guia do exercício -->
  <dialog class="sheet sheet--tall" id="dlgGuide">
    <form method="dialog" class="sheet__inner" id="guideInner">
      <header class="sheet__head">
        <h2 id="guideTitle"></h2>
        <button class="icon-btn" value="cancel" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div id="guideBody"></div>
    </form>
  </dialog>

  <!-- Escolher exercícios -->
  <dialog class="sheet sheet--tall" id="dlgPick">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head">
        <h2>Adicionar exercícios</h2>
        <button class="icon-btn" value="cancel" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="pickQ" placeholder="Buscar exercício" autocomplete="off"></div>
      <div class="chips" id="pickGroups"></div>
      <div class="pick-list" id="pickList"></div>
      <footer class="sheet__foot">
        <button type="button" class="btn btn--ghost" id="pickNew">+ Criar exercício</button>
        <button type="button" class="btn btn--primary" id="pickOk" disabled>Adicionar</button>
      </footer>
    </form>
  </dialog>

  <!-- Editar ficha -->
  <dialog class="sheet sheet--tall" id="dlgRoutine">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head">
        <h2 id="rtTitle">Nova ficha</h2>
        <button class="icon-btn" value="cancel" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <label class="field"><span>Nome da ficha</span><input id="rtName" type="text" maxlength="40" placeholder="Ex.: Treino A — Peito e tríceps"></label>
      <div class="rt-items" id="rtItems"></div>
      <button type="button" class="btn btn--soft btn--block" id="rtAdd">+ Adicionar exercício</button>
      <footer class="sheet__foot">
        <button type="button" class="btn btn--danger-ghost" id="rtDelete">Excluir</button>
        <button type="button" class="btn btn--primary" id="rtSave">Salvar ficha</button>
      </footer>
    </form>
  </dialog>

  <!-- Detalhe genérico (treino do histórico, resumo, listas) -->
  <dialog class="sheet" id="dlgInfo">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head">
        <h2 id="infoTitle"></h2>
        <button class="icon-btn" value="cancel" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div id="infoBody"></div>
    </form>
  </dialog>

  <!-- Novo exercício -->
  <dialog class="sheet sheet--small" id="dlgEx">
    <form method="dialog" class="sheet__inner" id="exForm">
      <header class="sheet__head">
        <h2>Novo exercício</h2>
        <button class="icon-btn" type="button" onclick="this.closest('dialog').close()" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <label class="field"><span>Nome</span><input id="exName" type="text" maxlength="40" required placeholder="Ex.: Supino no cross"></label>
      <label class="field"><span>Grupo muscular</span><select id="exGroup"></select></label>
      <label class="field"><span>Equipamento</span><select id="exEquip"></select></label>
      <footer class="sheet__foot">
        <button type="button" class="btn btn--ghost" onclick="this.closest('dialog').close()">Cancelar</button>
        <button type="submit" class="btn btn--primary" value="ok">Criar</button>
      </footer>
    </form>
  </dialog>

  <input type="file" id="stFile" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js?v=3"></script>
  <script src="anim.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
