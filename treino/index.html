<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forja — Musculação</title>
  <meta name="description" content="Forja: monte suas fichas de musculação, registre séries e cargas, controle o descanso e acompanhe sua evolução.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="brand__logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--accent)"/><g fill="#fff"><rect x="10" y="22" width="7" height="20" rx="2.5"/><rect x="18" y="17" width="7" height="30" rx="2.5"/><rect x="39" y="17" width="7" height="30" rx="2.5"/><rect x="47" y="22" width="7" height="20" rx="2.5"/><rect x="24" y="29" width="16" height="6" rx="2"/></g></svg>
        <div>
          <h1 class="brand__name">Forja</h1>
          <p class="brand__sub" id="topSub">Bora treinar</p>
        </div>
      </div>
      <button class="icon-btn" id="btnMenu" type="button" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <button class="resume" id="resumeBar" type="button" hidden>
      <span class="resume__dot" aria-hidden="true"></span>
      <span class="resume__txt"><strong id="resumeName">Treino</strong><small>Toque para voltar ao treino</small></span>
      <span class="resume__time" id="resumeTime">0:00</span>
    </button>

    <nav class="tabs" aria-label="Seções">
      <button type="button" class="tab" data-tab="treinar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
        <span>Treinar</span>
      </button>
      <button type="button" class="tab" data-tab="historico">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Histórico</span>
      </button>
      <button type="button" class="tab" data-tab="progresso">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="m5 15 4.5-5 3.5 3 6-7"/><path d="M15 6h4v4"/></svg>
        <span>Progresso</span>
      </button>
      <button type="button" class="tab" data-tab="exercicios">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 12h14M5 19h9"/></svg>
        <span>Exercícios</span>
      </button>
    </nav>
  </div>

  <!-- Treino em andamento (tela cheia) -->
  <section class="live" id="live" hidden aria-label="Treino em andamento">
    <header class="live__top">
      <button class="icon-btn" id="liveMin" type="button" aria-label="Minimizar treino">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="live__title">
        <input id="liveName" class="live__name" type="text" maxlength="40" aria-label="Nome do treino">
        <span class="live__meta"><span id="liveClock">0:00</span> · <span id="liveVol">0 kg</span> · <span id="liveSets">0 séries</span></span>
      </div>
      <button class="btn btn--primary btn--sm" id="liveFinish" type="button">Finalizar</button>
    </header>
    <div class="live__body" id="liveBody"></div>
    <div class="rest" id="rest" hidden>
      <div class="rest__bar"><i id="restFill"></i></div>
      <div class="rest__row">
        <button type="button" class="rest__btn" data-rest="-15">−15</button>
        <div class="rest__time"><small>Descanso</small><strong id="restTime">1:30</strong></div>
        <button type="button" class="rest__btn" data-rest="15">+15</button>
        <button type="button" class="rest__skip" data-rest="skip">Pular</button>
      </div>
    </div>
  </section>

  <!-- Escolher exercícios -->
  <dialog class="sheet" id="dlgPick">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head">
        <h2>Adicionar exercícios</h2>
        <button class="icon-btn" value="cancel" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="pickQ" placeholder="Buscar exercício" autocomplete="off"></div>
      <div class="chips" id="pickGroups"></div>
      <div class="pick-list" id="pickList"></div>
      <footer class="sheet__foot">
        <button type="button" class="btn btn--ghost" id="pickNew">+ Criar exercício</button>
        <button type="button" class="btn btn--primary" id="pickOk" disabled>Adicionar</button>
      </footer>
    </form>
  </dialog>

  <!-- Editar ficha -->
  <dialog class="sheet" id="dlgRoutine">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head">
        <h2 id="rtTitle">Nova ficha</h2>
        <button class="icon-btn" value="cancel" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <label class="field"><span>Nome da ficha</span><input id="rtName" type="text" maxlength="40" placeholder="Ex.: Treino A — Peito e tríceps"></label>
      <div class="rt-items" id="rtItems"></div>
      <button type="button" class="btn btn--soft btn--block" id="rtAdd">+ Adicionar exercício</button>
      <footer class="sheet__foot">
        <button type="button" class="btn btn--danger-ghost" id="rtDelete">Excluir</button>
        <button type="button" class="btn btn--primary" id="rtSave">Salvar ficha</button>
      </footer>
    </form>
  </dialog>

  <!-- Detalhe genérico (treino do histórico, exercício, resumo) -->
  <dialog class="sheet" id="dlgInfo">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head">
        <h2 id="infoTitle"></h2>
        <button class="icon-btn" value="cancel" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div id="infoBody"></div>
    </form>
  </dialog>

  <!-- Novo exercício -->
  <dialog class="sheet sheet--small" id="dlgEx">
    <form method="dialog" class="sheet__inner" id="exForm">
      <header class="sheet__head">
        <h2>Novo exercício</h2>
        <button class="icon-btn" type="button" onclick="this.closest('dialog').close()" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <label class="field"><span>Nome</span><input id="exName" type="text" maxlength="40" required placeholder="Ex.: Supino no cross"></label>
      <label class="field"><span>Grupo muscular</span><select id="exGroup"></select></label>
      <label class="field"><span>Equipamento</span><select id="exEquip"></select></label>
      <footer class="sheet__foot">
        <button type="button" class="btn btn--ghost" value="cancel" onclick="this.closest('dialog').close()">Cancelar</button>
        <button type="submit" class="btn btn--primary" value="ok">Criar</button>
      </footer>
    </form>
  </dialog>

  <!-- Ajustes -->
  <dialog class="sheet" id="dlgSettings">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head">
        <h2>Ajustes</h2>
        <button class="icon-btn" value="cancel" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="set-group">
        <label class="set-row"><span>Tema</span>
          <select id="stTheme"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Escuro</option></select>
        </label>
        <label class="set-row"><span>Descanso padrão</span>
          <select id="stRest"></select>
        </label>
        <label class="set-row"><span>Meta de treinos por semana</span>
          <select id="stGoal"></select>
        </label>
        <label class="set-row"><span>Som e vibração no fim do descanso</span>
          <input type="checkbox" id="stSound" class="switch">
        </label>
        <label class="set-row"><span>Aviso no fim do descanso (tela bloqueada)</span>
          <input type="checkbox" id="stNotify" class="switch">
        </label>
      </div>
      <div class="set-group">
        <button type="button" class="set-row set-row--btn" id="stExport">Fazer backup (.json)</button>
        <button type="button" class="set-row set-row--btn" id="stImport">Restaurar backup</button>
        <button type="button" class="set-row set-row--btn" id="stCsv">Exportar treinos para planilha (.csv)</button>
        <button type="button" class="set-row set-row--btn set-row--danger" id="stWipe">Apagar todos os dados</button>
      </div>
      <p class="fine">Seus dados ficam salvos só neste aparelho. Faça backup de vez em quando.</p>
      <input type="file" id="stFile" accept="application/json,.json" hidden>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=1"></script>
</body>
</html>
