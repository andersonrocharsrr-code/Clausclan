<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fazenda Aurora</title>
  <meta name="description" content="Jogo de fazenda: plante, crie animais, compre tratores e venda sua produção.">
  <meta name="theme-color" content="#f5efe3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top__row">
        <button class="farm" id="farmBtn" type="button" data-act="open-zone" data-zone="sede">
          <span class="farm__name" id="farmName">Fazenda Aurora</span>
          <span class="farm__meta">
            <span id="dayLbl">Dia 1</span> · <span id="clock">06:00</span> · <span id="weather">☀️ Sol</span>
          </span>
        </button>
        <div class="money" id="moneyChip" aria-live="polite">
          <span class="money__coin" aria-hidden="true">●</span>
          <strong id="money">R$ 0</strong>
        </div>
      </div>
      <div class="lvl" title="Nível da fazenda">
        <span class="lvl__badge" id="lvlBadge">1</span>
        <div class="lvl__bar"><i id="xpBar"></i></div>
        <span class="lvl__txt" id="xpTxt">0 / 80 XP</span>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabs" aria-label="Seções">
      <button type="button" class="tab" data-tab="fazenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>
        <span>Fazenda</span>
      </button>
      <button type="button" class="tab" data-tab="lavouras">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V10"/><path d="M12 13c-4 0-6-3-6-7 4 0 6 3 6 7Z"/><path d="M12 10c0-4 2-7 6-7 0 4-2 7-6 7Z"/><path d="M4 21h16"/></svg>
        <span>Lavouras</span>
      </button>
      <button type="button" class="tab" data-tab="animais">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9c-1.5 0-2.5-1-2.5-2.5M19 9c1.5 0 2.5-1 2.5-2.5"/><rect x="5" y="6" width="14" height="13" rx="6"/><circle cx="9.5" cy="11" r=".8"/><circle cx="14.5" cy="11" r=".8"/><ellipse cx="12" cy="15.5" rx="3" ry="2"/></svg>
        <span>Animais</span>
      </button>
      <button type="button" class="tab" data-tab="maquinas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="16" r="4"/><circle cx="18" cy="17.5" r="2.5"/><path d="M7 12V5h6l2 7h4v4"/><path d="M11 16h4.5"/></svg>
        <span>Máquinas</span>
      </button>
      <button type="button" class="tab" data-tab="mercado">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.5-5h-13Z"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg>
        <span>Mercado</span>
      </button>
    </nav>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet__backdrop" data-act="close-sheet"></div>
      <section class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet__grip" aria-hidden="true"></div>
        <header class="sheet__head">
          <h2 id="sheetTitle"></h2>
          <button type="button" class="icon-btn" data-act="close-sheet" aria-label="Fechar">✕</button>
        </header>
        <div class="sheet__body" id="sheetBody"></div>
      </section>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>

  <script src="app.js?v=1"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
