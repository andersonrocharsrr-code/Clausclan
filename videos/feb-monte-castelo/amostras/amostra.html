<!doctype html><meta charset="utf-8"><style>@font-face{font-family:Fira;font-weight:800;src:url(fira-sans-extra-condensed-latin-800-normal.woff2)}body{margin:0}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const c = document.getElementById('c').getContext('2d'), W = 1080, H = 1920, E = new URLSearchParams(location.search).get('estilo');
const {sin, cos, PI} = Math; function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const poly = (p, f, s, lw) => { c.beginPath(); p.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); if (f) { c.fillStyle = f; c.fill() } if (s) { c.strokeStyle = s; c.lineWidth = lw; c.lineJoin = 'round'; c.stroke() } };
const disc = (x, y, r, f, s, lw) => { c.beginPath(); c.arc(x, y, r, 0, 7); if (f) { c.fillStyle = f; c.fill() } if (s) { c.strokeStyle = s; c.lineWidth = lw; c.stroke() } };
const el = (x, y, rx, ry, f, s, lw, a = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, a, 0, 7); if (f) { c.fillStyle = f; c.fill() } if (s) { c.strokeStyle = s; c.lineWidth = lw; c.stroke() } };
const rr = (x, y, w, h, r, f, s, lw) => { c.beginPath(); c.roundRect(x, y, w, h, r); if (f) { c.fillStyle = f; c.fill() } if (s) { c.strokeStyle = s; c.lineWidth = lw; c.stroke() } };
function txt(s, x, y, size, col, o = {}) { c.save(); c.font = `800 ${size}px ${o.f || 'Fira'}`; c.textAlign = o.al || 'center'; c.letterSpacing = (o.ls || 0) + 'px'; if (o.cont) { c.strokeStyle = o.cont; c.lineWidth = o.lw || 14; c.lineJoin = 'round'; c.strokeText(s, x, y) } c.fillStyle = col; c.fillText(s, x, y); c.restore() }
// ================= ESTILO 2: RECORTE DOURADO =================
function dourado() {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d1118'); g.addColorStop(.55, '#1d2433'); g.addColorStop(1, '#2a2418'); c.fillStyle = g; c.fillRect(0, 0, W, H);

  poly([[0, 1300], [180, 980], [330, 1120], [470, 900], [600, 1100], [760, 940], [1080, 1260], [1080, 1920], [0, 1920]], '#3b4658'); poly([[470, 900], [600, 1100], [540, 1300], [400, 1300]], '#2c3546');

  // brilho quente atrás do topo (objeto surgindo da sombra)

  // bandeira em recorte bronze/dourado
  c.fillStyle = '#5a3a1c'; c.fillRect(556, 330, 10, 310); poly([[566, 335], [776, 350], [770, 480], [566, 470]], '#3f6b46'); poly([[566, 335], [776, 350], [770, 400], [566, 395]], '#4f8456'); poly([[620, 408], [671, 362], [722, 410], [671, 455]], '#d9b35a'); disc(671, 409, 26, '#2f4a7a');

  const prac = (x, y, s, braco) => { c.save(); c.translate(x, y); c.scale(s, s); const sil = '#141820', borda = '#e0b25e';
    poly([[-26, 0], [-20, -110], [20, -110], [26, 0]], sil); poly([[-34, -100], [-28, -190], [28, -190], [34, -100]], sil); el(0, -222, 24, 28, '#c08a5c'); poly([[-30, -236], [30, -236], [20, -262], [-20, -262]], '#3c4a30'); el(0, -236, 36, 9, '#3c4a30');
    poly([[34, -186], [38, -186], [34, -100], [30, -100]], borda); poly([[24, -230], [27, -250], [22, -214]], borda);
    if (braco) poly([[26, -180], [70, -300], [84, -296], [38, -170]], sil); else poly([[-28, -186], [-50, -110], [-40, -104], [-20, -170]], sil); c.restore() };
  prac(470, 760, 1.1, 0); prac(530, 700, 1.15, 1); prac(640, 790, 1.05, 0);
  // grão de papel
  const q = rng(9); c.fillStyle = 'rgba(255,240,210,.05)'; for (let i = 0; i < 4000; i++) c.fillRect(q() * W, q() * H, 2, 2);
  // placa no canto com traço dourado + legenda palavra por palavra com uma palavra em dourado
  txt('MONTE CASTELO', 70, 250, 76, '#f3e6c4', {al: 'left', ls: 2}); c.fillStyle = '#d9b35a'; c.fillRect(70, 272, 420, 6); txt('21 · FEV · 1945', 70, 330, 38, '#d9b35a', {al: 'left', ls: 6});
  txt('OS PRACINHAS TOMARAM O', 540, 1690, 64, '#f6f0e0', {ls: 1}); txt('TOPO.', 540, 1770, 64, '#d9b35a', {ls: 1});
}
// ================= ESTILO 3: CARTOON COLORIDO =================
function cartoon() {
  const L = '#1a1a1a', lw = 10;
  const g = c.createLinearGradient(0, 0, 0, 1300); g.addColorStop(0, '#5fc3ff'); g.addColorStop(1, '#c9ecff'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  disc(900, 280, 90, '#ffe14d', L, lw); for (let i = 0; i < 10; i++) { const a = i / 10 * PI * 2; c.strokeStyle = '#ffb300'; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(900 + cos(a) * 115, 280 + sin(a) * 115); c.lineTo(900 + cos(a) * 150, 280 + sin(a) * 150); c.stroke() }
  [[160, 300, 1], [430, 200, .8]].forEach(([x, y, s]) => { c.save(); c.translate(x, y); c.scale(s, s); el(0, 0, 90, 50, '#fff', L, lw); el(70, 10, 70, 45, '#fff', L, lw); el(-70, 12, 60, 40, '#fff', L, lw); c.restore() });
  poly([[-40, 1350], [220, 1000], [420, 1200], [640, 960], [900, 1180], [1120, 1000], [1120, 1920], [-40, 1920]], '#9fdc8a', L, lw);
  poly([[100, 1920], [320, 1150], [540, 560], [770, 1130], [980, 1920]], '#8b6cff', L, lw); poly([[540, 560], [640, 800], [600, 770], [560, 820], [510, 770], [455, 800]], '#ffffff', L, lw);
  // bandeira
  rr(552, 300, 16, 300, 6, '#8a5a2b', L, 6); poly([[568, 310], [800, 330], [792, 470], [568, 456]], '#1fbf4f', L, lw); poly([[626, 390], [682, 342], [740, 392], [682, 440]], '#ffd400', L, 7); disc(682, 391, 30, '#2a5bd7', L, 6);
  // pracinhas cartoon: cabeça grande, olhos grandes, sorriso, capacete
  const prac = (x, y, s, braco, cor) => { c.save(); c.translate(x, y); c.scale(s, s);
    rr(-30, -70, 24, 70, 10, '#5a6b3a', L, 7); rr(6, -70, 24, 70, 10, '#5a6b3a', L, 7); el(-18, 0, 22, 10, '#3b2a1a', L, 6); el(18, 0, 22, 10, '#3b2a1a', L, 6);
    rr(-44, -170, 88, 110, 26, cor, L, 8); if (braco) { rr(36, -250, 26, 100, 13, cor, L, 7); disc(49, -258, 16, '#ffc9a0', L, 6) } else { rr(-66, -160, 26, 90, 13, cor, L, 7) }
    disc(0, -230, 62, '#ffc9a0', L, 8); el(-22, -238, 12, 16, '#fff', L, 5); el(22, -238, 12, 16, '#fff', L, 5); disc(-20, -235, 6, L); disc(24, -235, 6, L); c.strokeStyle = L; c.lineWidth = 6; c.beginPath(); c.arc(0, -212, 22, .25, PI - .25); c.stroke(); disc(-40, -214, 9, 'rgba(255,110,110,.6)'); disc(40, -214, 9, 'rgba(255,110,110,.6)');
    c.beginPath(); c.ellipse(0, -270, 72, 44, 0, PI, 0); c.fillStyle = '#6f8442'; c.fill(); c.strokeStyle = L; c.lineWidth = 8; c.stroke(); rr(-80, -276, 160, 18, 9, '#6f8442', L, 7); c.restore() };
  prac(440, 820, .95, 0, '#7d9a4a'); prac(540, 740, 1.0, 1, '#86a552'); prac(660, 830, .95, 0, '#7d9a4a');
  rr(60, 170, 520, 130, 30, '#ffd400', L, lw); txt('MONTE CASTELO!', 320, 255, 64, L, {f: 'Fira'});
  txt('OS PRACINHAS TOMARAM', 540, 1690, 70, '#fff', {cont: L, lw: 16}); txt('O TOPO!', 540, 1780, 80, '#ffd400', {cont: L, lw: 16});
}
(async () => { await document.fonts.load('800 40px Fira'); (E === 'cartoon' ? cartoon : dourado)(); window.PRONTO = true })();
</script>
