<canvas id="c" width="1080" height="1920"></canvas>

<script>
// ===== "O Brasil em Monte Castelo" — tudo é função do tempo: seek(t) desenha o quadro t =====
const W = 1080, H = 1920, c = document.getElementById('c').getContext('2d');
const {sin, cos, PI, min, max, abs, exp, sqrt, hypot} = Math;
const clamp = (x, a = 0, b = 1) => min(b, max(a, x)), lerp = (a, b, u) => a + (b - a) * u, prog = (t, a, b) => clamp((t - a) / (b - a));
const out = u => 1 - Math.pow(1 - clamp(u), 3), outExpo = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(u)), io = u => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
function stepR(tau, w = 18, z = .82) { if (tau <= 0) return 0; if (z >= 1) { const x = w * tau; return 1 - exp(-x) * (1 + x) } const wd = w * sqrt(1 - z * z); return 1 - exp(-z * w * tau) * (cos(wd * tau) + (z * w / wd) * sin(wd * tau)) }
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
// paleta limpa: papel claro, tinta azul-marinho, UM destaque (verde Brasil), amarelo só no emblema/bandeira, vermelho só para perdas
// paleta Recorte Dourado: cena escura azul-ardósia, ocre, creme e dourado (o destaque), vermelho-terra só para perdas
const K = { papel: '#131925', papel2: '#1C2331', tinta: '#F3E6C4', tinta2: '#B5A687', verde: '#D9B35A', verde2: '#F0D48A', amarelo: '#D9B35A', azul: '#4B6A80', vermelho: '#C8553A', cinza: '#5E6672', mar: '#1E2A3A', terra: '#B4874A', neve: '#EFE8DA', bra: '#3F6B46', braAz: '#2F4A7A' };
const SANS = 'Fira', SERIF = 'Fira';
// ---------- texto ----------
function txt(s, x, y, size, col, o = {}) { s = String(s).toUpperCase(); if (o.serif) size *= .92; c.save(); c.globalAlpha *= o.a ?? 1; c.font = `${o.w || 800} ${size}px Fira`; c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = size * .18; c.shadowOffsetY = size * .04; c.textAlign = o.al || 'center'; c.textBaseline = 'alphabetic'; c.letterSpacing = (o.ls ?? (o.serif ? -size * .02 : 0)) + 'px'; c.fillStyle = col; if (o.max) { const w = c.measureText(s).width; if (w > o.max) { c.translate(x, y); c.scale(o.max / w, 1); c.fillText(s, 0, 0); c.restore(); return } } c.fillText(s, x, y); c.restore() }
function larg(s, size, o = {}) { s = String(s).toUpperCase(); if (o.serif) size *= .92; c.save(); c.font = `${o.w || 800} ${size}px Fira`; c.letterSpacing = (o.ls ?? (o.serif ? -size * .02 : 0)) + 'px'; const w = c.measureText(s).width; c.restore(); return w }
// texto que sobe de dentro de uma máscara (entrada de 0,45 s, mola de assentamento)
function sobe(tl, t0, s, x, y, size, col, o = {}) { const u = stepR(tl - t0, 20, .9); if (u <= 0) return; c.save(); const w = larg(s, size, o), al = o.al || 'center', x0 = al === 'center' ? x - w / 2 : al === 'right' ? x - w : x; c.beginPath(); c.rect(x0 - 20, y - size * 1.05, w + 40, size * 1.32); c.clip(); txt(s, x, y + size * 1.1 * (1 - u), size, col, o); c.restore() }
// etiqueta pequena (mono-like) com espaçamento largo
const rot = (tl, t0, s, x, y, col = K.tinta2, size = 30) => { size *= 1.25; const u = out((tl - t0) / .3); if (u > 0) txt(s, x, y + (1 - u) * 12, size, col, {w: 700, ls: size * .2, a: u, max: 980}) };
// ---------- formas ----------
const disc = (x, y, r, col) => { c.fillStyle = col; c.beginPath(); c.arc(x, y, max(0, r), 0, 7); c.fill() };
const rr = (x, y, w, h, r, col) => { c.fillStyle = col; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill() };
const poly = (pts, col) => { c.fillStyle = col; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill() };
const linha = (x0, y0, x1, y1, col, w) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke() };
function cartao(x, y, w, h, u, col = '#1E2635') { if (u <= 0) return; const s = lerp(.9, 1, u); c.save(); c.globalAlpha *= clamp(u * 1.4); c.translate(x + w / 2, y + h / 2); c.scale(s, s); rr(-w / 2 + 6, -h / 2 + 14, w, h, 18, 'rgba(0,0,0,.35)'); rr(-w / 2, -h / 2, w, h, 18, col); c.strokeStyle = 'rgba(217,179,90,.55)'; c.lineWidth = 3; c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, 18); c.stroke(); c.restore() }
// ---------- mapas (lon/lat → tela) ----------
const ITALIA = [[7.6,44.1],[7.0,45.9],[8.4,46.3],[9.4,46.5],[10.5,46.9],[12.2,47.1],[13.7,46.5],[13.6,45.6],[12.4,45.4],[12.3,44.6],[13.5,43.6],[14.5,42.6],[15.9,41.9],[16.2,41.4],[17.4,40.9],[18.5,40.1],[18.0,39.9],[17.1,40.5],[16.6,39.9],[17.1,39.0],[16.1,38.0],[15.6,38.0],[15.8,38.9],[16.0,39.5],[15.6,40.1],[14.9,40.3],[14.3,40.6],[13.8,41.2],[12.6,41.5],[11.7,42.2],[11.1,42.7],[10.5,43.0],[10.3,43.6],[9.8,44.1],[8.7,44.4],[8.1,43.9]];
const SICILIA = [[12.4,37.8],[15.1,38.2],[15.6,38.3],[15.1,37.1],[14.3,37.0],[12.6,37.6]], SARDENHA = [[8.4,41.0],[9.2,41.3],[9.8,40.6],[9.6,39.2],[8.9,39.0],[8.4,39.4],[8.6,40.6]];
const BRASIL = [[-60,5],[-51,4],[-50,0],[-44,-2],[-35,-5],[-35,-9],[-39,-15],[-41,-22],[-48,-26],[-53,-33],[-57,-30],[-58,-20],[-60,-15],[-69,-11],[-74,-7],[-70,-4],[-67,1],[-62,4]];
const AFRICA = [[-17,15],[-17,21],[-10,30],[-6,36],[10,37],[20,32],[32,31],[35,25],[43,12],[51,12],[42,-2],[40,-15],[35,-25],[20,-35],[17,-29],[12,-17],[13,-5],[9,4],[-5,5],[-12,7]];
const EUROPA = [[-10,36],[-9,43],[-2,44],[-5,48],[3,51],[8,54],[10,58],[5,62],[15,69],[28,71],[40,67],[30,60],[28,46],[22,40],[20,37],[12,44],[15,40],[8,44],[3,43]];
const SULAMERICA = [[-80,8],[-72,12],[-62,10],[-50,0],[-35,-6],[-38,-15],[-48,-26],[-58,-38],[-65,-42],[-68,-52],[-74,-50],[-72,-35],[-71,-18],[-81,-6]];
const LUGAR = { napoles: [14.27, 40.85], castelo: [10.94, 44.2], castelnuovo: [11.05, 44.24], montese: [10.94, 44.27], fornovo: [10.1, 44.69], rio: [-43.2, -22.9], recife: [-34.9, -8.05] };
function mapa(cx, cy, escala, lon0, lat0, terras, o = {}) { const P = ([lo, la]) => [cx + (lo - lon0) * escala, cy - (la - lat0) * escala * 1.25]; c.fillStyle = o.mar || K.mar; c.fillRect(0, 0, W, H); terras.forEach(([pts, col]) => poly(pts.map(P), col || K.terra)); return P }
// ---------- símbolos ----------
function bandeira(x, y, w, ondula = 0) { const h = w * .7; c.save(); c.translate(x, y); for (let i = 0; i < 12; i++) { const x0 = i * w / 12, dy = sin(ondula + i * .6) * w * .03 * (i / 12); rr(x0, dy, w / 12 + 1, h, 0, i % 3 === 2 ? '#365E3D' : K.bra) } poly([[w * .5, h * .1], [w * .92, h * .5], [w * .5, h * .9], [w * .08, h * .5]], '#D9B35A'); disc(w * .5, h * .5, h * .24, K.braAz); c.fillStyle = 'rgba(243,230,196,.6)'; c.fillRect(w * .28, h * .48, w * .44, h * .04); c.restore() }
function cobra(x, y, s, t, fumaca = 1) { c.save(); c.translate(x, y); c.scale(s, s); c.lineCap = 'round'; c.strokeStyle = '#00843D'; c.lineWidth = 34; c.beginPath(); c.moveTo(-120, 120); c.bezierCurveTo(-180, 40, -20, 40, -60, -30); c.bezierCurveTo(-100, -100, 60, -110, 40, -40); c.stroke(); c.strokeStyle = '#0FA458'; c.lineWidth = 12; c.stroke();
  c.beginPath(); c.ellipse(70, -52, 46, 30, -.2, 0, 7); c.fillStyle = '#00843D'; c.fill(); disc(80, -64, 7, '#fff'); disc(82, -64, 3.5, '#14212E'); c.strokeStyle = '#5A3A1C'; c.lineWidth = 9; c.beginPath(); c.moveTo(108, -40); c.lineTo(150, -30); c.stroke(); rr(146, -54, 26, 30, 6, '#5A3A1C');
  for (let i = 0; i < 4; i++) { const f = ((t * .6 + i / 4) % 1); c.globalAlpha = fumaca * (1 - f) * .8; disc(160 + sin(f * 6 + i) * 14, -60 - f * 140, 10 + f * 22, '#BFC5CA') } c.restore() }
function navio(x, y, s, inc = 0, col = K.tinta) { c.save(); c.translate(x, y); c.rotate(inc); c.scale(s, s); poly([[-150, 0], [150, 0], [120, 40], [-130, 40]], col); rr(-60, -40, 110, 40, 4, col); rr(-30, -80, 24, 40, 2, col); rr(10, -70, 20, 30, 2, col); c.restore() }
function submarino(x, y, s, col = '#5B6670') { c.save(); c.translate(x, y); c.scale(s, s); c.beginPath(); c.ellipse(0, 0, 170, 26, 0, 0, 7); c.fillStyle = col; c.fill(); rr(-30, -62, 60, 44, 8, col); rr(-6, -96, 8, 40, 2, col); c.restore() }
function iconeSoldado(x, y, s, col = K.tinta, rifle = true) { c.save(); c.translate(x, y); c.scale(s, s); disc(0, -150, 22, col); c.beginPath(); c.ellipse(0, -160, 32, 16, 0, PI, 0); c.fillStyle = col; c.fill(); rr(-28, -128, 56, 80, 14, col); rr(-24, -52, 20, 56, 8, col); rr(4, -52, 20, 56, 8, col); if (rifle) { c.strokeStyle = col; c.lineWidth = 8; c.beginPath(); c.moveTo(-40, -40); c.lineTo(46, -170); c.stroke() } c.restore() }
function aviao(x, y, s, ang = 0, col = K.tinta) { c.save(); c.translate(x, y); c.rotate(ang); c.scale(s, s); c.beginPath(); c.ellipse(0, 0, 120, 20, 0, 0, 7); c.fillStyle = col; c.fill(); poly([[-10, -8], [40, -110], [60, -110], [40, -8]], col); poly([[-10, 8], [40, 110], [60, 110], [40, 8]], col); poly([[-100, 0], [-130, -40], [-118, 0], [-130, 40]], col); disc(126, 0, 12, col); c.restore() }
function montanha(cx, base, larg2, alt, cor = K.tinta, neve = 0) { const pts = [[cx - larg2 / 2, base], [cx - larg2 * .25, base - alt * .55], [cx - larg2 * .1, base - alt * .8], [cx, base - alt], [cx + larg2 * .12, base - alt * .78], [cx + larg2 * .3, base - alt * .5], [cx + larg2 / 2, base]]; poly(pts, cor); poly([[cx, base - alt], [cx + larg2 * .12, base - alt * .78], [cx + larg2 * .3, base - alt * .5], [cx + larg2 / 2, base], [cx + larg2 * .05, base]], 'rgba(20,16,10,.42)'); if (neve) poly([[cx - larg2 * .1, base - alt * .8], [cx, base - alt], [cx + larg2 * .12, base - alt * .78], [cx + larg2 * .04, base - alt * .74], [cx - larg2 * .04, base - alt * .78]], `rgba(255,255,255,${neve})`); return pts }
function xis(x, y, r, u, col = K.vermelho) { if (u <= 0) return; c.strokeStyle = col; c.lineWidth = r * .28; c.lineCap = 'round'; const a = min(1, u * 2), b = clamp(u * 2 - 1); c.beginPath(); c.moveTo(x - r, y - r); c.lineTo(x - r + 2 * r * a, y - r + 2 * r * a); if (b > 0) { c.moveTo(x + r, y - r); c.lineTo(x + r - 2 * r * b, y - r + 2 * r * b) } c.stroke() }
function pino(x, y, u, col = K.verde, pulsa = 0) { if (u <= 0) return; const s = stepR(u * .4, 22, .6); if (pulsa) { c.strokeStyle = col; c.lineWidth = 4; const f = pulsa % 1; c.globalAlpha = 1 - f; c.beginPath(); c.arc(x, y, 14 + f * 60, 0, 7); c.stroke(); c.globalAlpha = 1 } disc(x, y, 16 * s, col); disc(x, y, 7 * s, '#fff') }
function carimbo(tl, t0, s, x, y, size, col = K.verde, ang = -.12) { const u = clamp((tl - t0) / .18); if (u <= 0) return; const sc = lerp(2.2, 1, out(u)); c.save(); c.translate(x, y); c.rotate(ang); c.scale(sc, sc); c.globalAlpha = min(1, u * 2); const w = larg(s, size, {ls: size * .1}) + 60, h = size * 1.4; c.strokeStyle = col; c.lineWidth = 9; c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, 14); c.stroke(); txt(s, 0, size * .36, size, col, {ls: size * .1}); c.restore() }
// contador que rola até o valor (dígitos com separador de milhar)
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
// ---------- cursor interativo "VOCÊ" ----------
function cursor(x, y, tl, cliques = [], o = {}) { let p = 1; for (const tc of cliques) p -= .16 * exp(-(((tl - tc) / .045) ** 2)); const ent = stepR(tl - (o.t0 ?? 0), 16, .9); if (ent <= 0) return;
  for (const tc of cliques) { const r = (tl - tc) / .4; if (r > 0 && r < 1) { c.strokeStyle = K.verde; c.lineWidth = 4; c.globalAlpha = 1 - r; c.beginPath(); c.arc(x, y, 10 + r * 70, 0, 7); c.stroke(); c.globalAlpha = 1 } }
  c.save(); c.translate(x, y); c.scale(p * ent * 1.5, p * ent * 1.5); poly([[0, 0], [0, 38], [9, 30], [15, 44], [21, 41.5], [15, 28], [27, 28]], '#0D1118'); poly([[3, 7], [3, 31], [9.5, 25], [15.5, 38], [18, 37], [12, 24], [20, 24]], K.tinta);
  c.restore() }
// trajeto do cursor por pontos [t, x, y] com molas suaves entre eles
function caminho(tl, pts) { let x = pts[0][1], y = pts[0][2]; for (let i = 1; i < pts.length; i++) { const u = stepR(tl - pts[i][0], 13, .92); x += (pts[i][1] - pts[i - 1][1]) * u; y += (pts[i][2] - pts[i - 1][2]) * u } return [x, y] }
// ---------- fundo papel com textura leve ----------
function papel(t, cor = K.papel) { const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0D1118'); g.addColorStop(.6, cor); g.addColorStop(1, '#241E15'); c.fillStyle = g; c.fillRect(0, 0, W, H); [[260, '#1A2130'], [520, '#1E2636'], [780, '#212A3B']].forEach(([y, col]) => { c.fillStyle = col; c.globalAlpha = .55; c.fillRect(0, y, W, 70); c.globalAlpha = 1 }); const gl = c.createRadialGradient(540, 820, 0, 540, 820, 760); gl.addColorStop(0, 'rgba(217,179,90,.12)'); gl.addColorStop(1, 'rgba(217,179,90,0)'); c.fillStyle = gl; c.fillRect(0, 0, W, H) }
const GRAO = (() => { const k = document.createElement('canvas'); k.width = k.height = 512; const g = k.getContext('2d'), q = rng(5); for (let i = 0; i < 9000; i++) { g.fillStyle = q() < .5 ? 'rgba(255,240,210,.07)' : 'rgba(0,0,0,.08)'; g.fillRect(q() * 512, q() * 512, 2, 2) } return k })();
// Apeninos em camadas recortadas (planos de luz e de sombra em ardósia), com neve
function apeninos(t, base = 1350, neve = 1) { const camadas = [[base - 380, '#2A3344', '#222A38', .5], [base - 200, '#36404F', '#2B3340', .7], [base, '#4B5566', '#3A4352', 1]]; camadas.forEach(([y, cor, cor2, f], k) => { const q = rng(20 + k); let x = -60; const pts = [[-60, H]]; while (x < W + 120) { pts.push([x, y - q() * 220 * f]); x += 140 + q() * 120 } pts.push([W + 120, H]); poly(pts, cor); for (let i = 1; i < pts.length - 2; i += 2) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; poly([[x0, y0], [x1, y1], [x1, H], [x0 + (x1 - x0) * .4, H]], cor2); if (neve && y0 < y - 120 * f) poly([[x0 - 30, y0 + 34], [x0, y0], [x0 + 34, y0 + 30], [x0 + 6, y0 + 22]], `rgba(239,232,218,${.85 * neve})`) } }) }
</script>
