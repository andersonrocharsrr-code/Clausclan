const CMB = (() => { const N = 1024, cv = document.createElement('canvas'); cv.width = N; cv.height = N / 2; const x = cv.getContext('2d'), img = x.createImageData(N, N / 2), q = rng(71);

// nome, etiqueta do canto, dois números com a palavra da fala que faz cada um aparecer

// ---------- câmera por trecho (u = 0 → 1 dentro do trecho) ----------
const ORDEM = SEG.map(s => s.id), GRUPO = { terra: gTerra, espaco: gTerra, sistema: gSis, via: gGal, andromeda: gGal, galaxias: gWeb, universo: gUni, alem: gMul };

  if (id === 'via') { const e = eio(u), d = Math.exp(lerp(Math.log(75), Math.log(190), e)); const al = SOLVL.clone().lerp(V(0, 0, 0), eio(cl(u * 1.2 - .1))); return poseOrb(al, d, Math.atan2(SOLVL.x, SOLVL.z) + .3 + .5 * e, lerp(.95, .85, e), 36, .18) }

const VIA = .9; // meia viagem antes e depois de cada corte
function estado(t) { let i = 0; while (i + 1 < SEG.length && t >= SEG[i + 1].v0) i++; const s = SEG[i], fim = i + 1 < SEG.length ? SEG[i + 1].v0 : DUR, u = cl((t - s.v0) / (fim - s.v0));
