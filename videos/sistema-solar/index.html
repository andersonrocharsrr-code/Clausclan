</head><body><div id="tela"><canvas id="gl" width="1080" height="1920"></canvas><canvas id="hud" width="1080" height="1920"></canvas></div>
<script type="module">

import * as THREE from 'three';

const W = 1080, H = 1920;
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });

const ld = new THREE.TextureLoader(), esperar = [];

{ const q = rng(11), n = 26000, pos = new Float32Array(n * 3), cor = new Float32Array(n * 3), tam = new Float32Array(n);

function gradTex(paradas, tam = 256) { const cv = document.createElement('canvas'); cv.width = cv.height = tam; const x = cv.getContext('2d'), g = x.createRadialGradient(tam / 2, tam / 2, 0, tam / 2, tam / 2, tam / 2); paradas.forEach(([o, c]) => g.addColorStop(o, c)); x.fillStyle = g; x.fillRect(0, 0, tam, tam); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t }
// ---------- Sol ----------
const SOL_R = 6;
const solTex = tex('sun-1024.webp');
const sol = new THREE.Mesh(new THREE.SphereGeometry(SOL_R, 128, 64), new THREE.MeshBasicMaterial({ map: solTex, color: new THREE.Color(1.25, 1.0, .78) })); cena.add(sol);

const luz = new THREE.PointLight(0xfff4e6, 3.2, 0, 0); cena.add(luz); cena.add(new THREE.AmbientLight(0x223344, .035));

  vertexShader: 'varying vec3 vN; varying vec3 vW; void main(){ vN = normalize(mat3(modelMatrix)*normal); vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
  fragmentShader: 'uniform vec3 cor; uniform float forca, ex; varying vec3 vN; varying vec3 vW; void main(){ vec3 v = normalize(cameraPosition - vW); float d = -dot(normalize(vN), v); float g = pow(smoothstep(0., .3, d), ex * .5); float dia = smoothstep(-.3, .5, dot(normalize(vN), normalize(-vW))); gl_FragColor = vec4(cor * forca * g * dia, 1.); }' })) }
// ---------- planetas ----------
// raio visual (não está em escala real de distância), distância da órbita, período (s de vídeo por volta), inclinação do eixo
const DADOS = [
  ['mercurio', 'mercury-1024.webp', .55, 14, 9, .03, null],
  ['venus', 'venus-1024.webp', .95, 20, 16, 3.1, ['#FFD9A0', .9, 2.4]],
  ['terra', 'earth_color_4096x2048.jpg', 1.0, 27, 24, .41, ['#5AA8FF', 1.4, 2.6]],
  ['marte', 'mars-1024.webp', .7, 34, 34, .44, ['#FF9A6A', .45, 3.2]],
  ['jupiter', 'jupiter-1024.webp', 3.2, 50, 60, .05, ['#F2D7B0', .5, 3.5]],
  ['saturno', 'saturn-1024.webp', 2.7, 68, 85, .47, ['#F2DDB0', .45, 3.5]],
  ['urano', 'uranus-1024.webp', 1.8, 84, 120, 1.71, ['#9FE8F0', .8, 3]],
  ['netuno', 'neptune-1024.webp', 1.75, 98, 160, .49, ['#5C8CFF', .9, 3]]];

  const piv = new THREE.Group(), eixo = new THREE.Group(); eixo.rotation.z = incl; piv.add(eixo); cena.add(piv);
  const mat = new THREE.MeshStandardMaterial({ map: tex(f), roughness: 1, metalness: 0 });
  if (nome === 'terra') { mat.emissiveMap = tex('earth_nightlights_2048x1024.jpg'); mat.emissive = new THREE.Color(1, .85, .6); mat.emissiveIntensity = .55; mat.roughness = .75 }
  const corpo = new THREE.Mesh(new THREE.SphereGeometry(r, 160, 80), mat); eixo.add(corpo);
  let nuvens = null; if (nome === 'terra') { nuvens = new THREE.Mesh(new THREE.SphereGeometry(r * 1.008, 160, 80), new THREE.MeshStandardMaterial({ color: 0xffffff, alphaMap: tex('earth_clouds_4096x2048.jpg', false), transparent: true, opacity: .9, depthWrite: false, roughness: 1 })); eixo.add(nuvens) }
  if (atm) { const a = atmosfera(r * 1.045, atm[0], atm[1], atm[2]); piv.add(a) }
  let aneis = null; if (nome === 'saturno') { const g = new THREE.RingGeometry(r * 1.24, r * 2.27, 256, 1); const p = g.attributes.position, uv = g.attributes.uv; for (let i = 0; i < p.count; i++) { const rr = Math.hypot(p.getX(i), p.getY(i)); uv.setXY(i, (rr - r * 1.24) / (r * 1.03), .5) }
    aneis = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex('saturn-ring-2048.webp'), transparent: true, side: THREE.DoubleSide, roughness: 1, depthWrite: false })); aneis.rotation.x = -Math.PI / 2; eixo.add(aneis) }
  // órbita
  const pts = []; for (let i = 0; i <= 256; i++) { const a = i / 256 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * d, 0, Math.sin(a) * d)) }
  const orb = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x6f86a8, transparent: true, opacity: .28 })); cena.add(orb);
  P[nome] = { piv, eixo, corpo, nuvens, aneis, r, d, per, orb, fase: (nome.length * 1.7) % 6.28 } }
// ---------- HUD (texto por cima) ----------
const hud = document.getElementById('hud').getContext('2d');
function txt(s, x, y, tam, cor, o = {}) { hud.save(); hud.font = `${o.w || 800} ${tam}px Fira`; hud.textAlign = o.al || 'center'; hud.letterSpacing = (o.ls || 0) + 'px'; hud.fillStyle = cor; hud.shadowColor = 'rgba(0,0,0,.7)'; hud.shadowBlur = tam * .25; hud.globalAlpha = o.a ?? 1; hud.fillText(String(s).toUpperCase(), x, y); hud.restore() }
const FICHA = {
  sol: ['O SOL', '4,6 BILHÕES DE ANOS', 'COMPOSIÇÃO', [['HIDROGÊNIO', 73, '#FFB347'], ['HÉLIO', 25, '#FFD98A'], ['OUTROS', 2, '#C9C9C9']]],
  mercurio: ['MERCÚRIO', '4,5 BILHÕES DE ANOS', 'EXOSFERA QUASE VAZIA', [['OXIGÊNIO', 42, '#7FB8FF'], ['SÓDIO', 29, '#FFD27A'], ['HIDROGÊNIO', 22, '#E0E0E0'], ['HÉLIO', 6, '#B9A6FF']]],
  venus: ['VÊNUS', '4,5 BILHÕES DE ANOS', 'ATMOSFERA', [['GÁS CARBÔNICO', 96.5, '#FFB066'], ['NITROGÊNIO', 3.5, '#8FB7FF']]],
  terra: ['TERRA', '4,54 BILHÕES DE ANOS', 'ATMOSFERA', [['NITROGÊNIO', 78, '#8FB7FF'], ['OXIGÊNIO', 21, '#7FE0C0'], ['ARGÔNIO', .93, '#D0D0D0'], ['GÁS CARBÔNICO', .04, '#FFB066']]],
  marte: ['MARTE', '4,6 BILHÕES DE ANOS', 'ATMOSFERA', [['GÁS CARBÔNICO', 95, '#FFB066'], ['NITROGÊNIO', 2.6, '#8FB7FF'], ['ARGÔNIO', 1.9, '#D0D0D0']]],
  jupiter: ['JÚPITER', '4,6 BILHÕES DE ANOS', 'ATMOSFERA', [['HIDROGÊNIO', 90, '#FFD98A'], ['HÉLIO', 10, '#B9A6FF']]],
  saturno: ['SATURNO', '4,5 BILHÕES DE ANOS', 'ATMOSFERA', [['HIDROGÊNIO', 96, '#FFD98A'], ['HÉLIO', 3, '#B9A6FF']]],
  urano: ['URANO', '4,5 BILHÕES DE ANOS', 'ATMOSFERA', [['HIDROGÊNIO', 83, '#FFD98A'], ['HÉLIO', 15, '#B9A6FF'], ['METANO', 2.3, '#7FE8E0']]],
  netuno: ['NETUNO', '4,5 BILHÕES DE ANOS', 'ATMOSFERA', [['HIDROGÊNIO', 80, '#FFD98A'], ['HÉLIO', 19, '#B9A6FF'], ['METANO', 1.5, '#7FE8E0']]] };
function ficha(id, u) { if (u <= 0) return; const [nome, idade, rot, itens] = FICHA[id], e = 1 - Math.pow(1 - Math.min(1, u), 3), y0 = 1280 + (1 - e) * 60;
  hud.save(); hud.globalAlpha = Math.min(1, u * 1.5); const gr = hud.createLinearGradient(0, y0 - 260, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.35, 'rgba(0,0,0,.72)'); gr.addColorStop(1, 'rgba(0,0,0,.9)'); hud.fillStyle = gr; hud.fillRect(0, y0 - 260, W, H);
  txt(nome, 80, y0, 120, '#FFFFFF', { al: 'left', ls: 2 }); hud.fillStyle = '#E8B04A'; hud.fillRect(84, y0 + 28, 160 * e, 5);
  txt('IDADE', 84, y0 + 96, 26, '#9FB3CC', { al: 'left', w: 600, ls: 6 }); txt(idade, 84, y0 + 146, 52, '#F4E7C8', { al: 'left' });
  txt(rot, 84, y0 + 222, 26, '#9FB3CC', { al: 'left', w: 600, ls: 6 });
  itens.forEach(([n, pc, cor], i) => { const y = y0 + 270 + i * 62, k = Math.min(1, Math.max(0, u * 2 - .4 - i * .15)); txt(n, 84, y + 22, 34, '#FFFFFF', { al: 'left', w: 600 }); txt((pc + '').replace('.', ',') + '%', 996, y + 22, 34, cor, { al: 'right' });
    hud.fillStyle = 'rgba(255,255,255,.12)'; hud.fillRect(84, y + 34, 912, 8); hud.fillStyle = cor; hud.fillRect(84, y + 34, 912 * Math.max(.006, pc / 100) * k, 8) });
  hud.restore() }
// ---------- quadro ----------
const alvo = new THREE.Vector3();
function posPlaneta(n, t) { const p = P[n], a = p.fase + t * Math.PI * 2 / p.per; return new THREE.Vector3(Math.cos(a) * p.d, 0, Math.sin(a) * p.d) }

  if (nome === 'geral') { const a = o.ang ?? .6 + t * .02; cam.position.set(Math.cos(a) * (o.dist ?? 165), o.alt ?? 62, Math.sin(a) * (o.dist ?? 165)); cam.lookAt(0, -14, 0); cam.fov = 40 }
